<svg xmlns="http://www.w3.org/2000/svg" width="600" height="172" viewBox="0 0 600 172" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count links to the changed population</title><desc>Grass is eaten by rabbits, and rabbits are eaten by foxes. If foxes change, rabbits are one link away and grass is two links away.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="171" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Count links to the changed population</text><line x1="147.0" y1="90.0" x2="235.0" y2="90.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="365.0" y1="90.0" x2="453.0" y2="90.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="37.0" y="73.0" width="106.0" height="34.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="90.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Grass</text><text x="90.0" y="133.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Two links · indirect</text><rect x="247.0" y="73.0" width="106.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="300.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Rabbit</text><text x="300.0" y="133.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">One link · direct</text><rect x="457.0" y="73.0" width="106.0" height="34.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="510.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Fox</text><text x="510.0" y="133.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Changed population</text><text x="22.0" y="158.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Feeding arrows still point from food to eater.</text></svg>
