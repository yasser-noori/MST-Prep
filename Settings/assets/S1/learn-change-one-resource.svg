<svg xmlns="http://www.w3.org/2000/svg" width="600" height="228" viewBox="0 0 600 228" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Change one resource to test its effect</title><desc>In the first comparison both light and water change. In the second comparison light changes and water stays the same, so the result can be used to test light.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="227" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Change one resource to test its effect</text><rect x="22.0" y="54.0" width="556.0" height="67.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="36.0" y="80.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Two resources change</text><text x="36.0" y="102.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">A and B are identical otherwise.</text><text x="383.0" y="73.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Group A</text><text x="519.0" y="73.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Group B</text><rect x="329.0" y="80.0" width="108.0" height="19.0" rx="4" fill="#ddeaff" stroke="none" stroke-width="1.5"/><text x="383.0" y="94.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bright light</text><text x="383.0" y="113.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">20 mL water</text><rect x="465.0" y="80.0" width="108.0" height="19.0" rx="4" fill="#ffe6d2" stroke="none" stroke-width="1.5"/><text x="519.0" y="94.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Shade</text><text x="519.0" y="113.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">10 mL water</text><rect x="22.0" y="139.0" width="556.0" height="67.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="36.0" y="165.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Only light changes</text><text x="36.0" y="187.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">A and B are identical otherwise.</text><text x="383.0" y="158.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Group A</text><text x="519.0" y="158.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Group B</text><rect x="329.0" y="165.0" width="108.0" height="19.0" rx="4" fill="#ddeaff" stroke="none" stroke-width="1.5"/><text x="383.0" y="179.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bright light</text><text x="383.0" y="198.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">20 mL water</text><rect x="465.0" y="165.0" width="108.0" height="19.0" rx="4" fill="#ffe6d2" stroke="none" stroke-width="1.5"/><text x="519.0" y="179.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Shade</text><text x="519.0" y="198.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">20 mL water</text></svg>
