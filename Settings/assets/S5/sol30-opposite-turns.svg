<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sign seen from above</title><desc>A square sign in plan view has pivot O and edge labels T, R, B and L. The first arrow at R points up the page. A second equal arrow points up at L and turns the sign the opposite way.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="249" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="208.0" y="48.0" width="144.0" height="144.0" rx="4" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><line x1="208.0" y1="120.0" x2="352.0" y2="120.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="280.0" y1="48.0" x2="280.0" y2="192.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 3"/><circle cx="280.0" cy="48.0" r="3.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/><text x="280.0" y="38.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">T</text><circle cx="280.0" cy="192.0" r="3.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/><text x="280.0" y="212.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">B</text><circle cx="208.0" cy="120.0" r="3.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/><text x="189.0" y="125.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">L</text><circle cx="352.0" cy="120.0" r="3.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/><text x="372.0" y="125.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">R</text><circle cx="280.0" cy="120.0" r="3.0" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/><text x="280.0" y="140.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">O</text><line x1="352.0" y1="120.0" x2="352.0" y2="71.0" stroke="#1f6feb" stroke-width="2.5"/><path d="M352,61 L357.0,71.0 L347.0,71.0 Z" fill="#1f6feb" stroke="#1f6feb" stroke-width="0.5" stroke-linejoin="round"/><text x="370.0" y="68.0" font-size="15" fill="#1f6feb" text-anchor="start" font-weight="bold">First push</text><line x1="208.0" y1="120.0" x2="208.0" y2="71.0" stroke="#d4600f" stroke-width="2.5"/><path d="M208,61 L213.0,71.0 L203.0,71.0 Z" fill="#d4600f" stroke="#d4600f" stroke-width="0.5" stroke-linejoin="round"/><text x="190.0" y="68.0" font-size="15" fill="#d4600f" text-anchor="end" font-weight="bold">Second push</text><text x="280.0" y="235.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">Equal distances and equal pushes give opposite turns.</text></svg>
