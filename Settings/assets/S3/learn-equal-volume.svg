<svg xmlns="http://www.w3.org/2000/svg" width="544" height="207" viewBox="0 0 544 207" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare mass at the same volume</title><desc>Two 10-cubic-centimetre cubes have masses 20 g and 30 g, giving densities of 2 and 3 grams per cubic centimetre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="543" height="206" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Compare mass at the same volume</text><path d="M108,78 l15.36,-15.36 h48 l-15.36,15.36 Z" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5" stroke-linejoin="round"/><path d="M156,78 l15.36,-15.36 v48 l-15.36,15.36 Z" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5" stroke-linejoin="round"/><rect x="108.0" y="78.0" width="48.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="138.0" y="152.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">20 g in 10 cm³</text><text x="138.0" y="180.0" font-size="15" fill="#1f6feb" text-anchor="middle" font-weight="normal">20 ÷ 10 = 2 g/cm³</text><path d="M376,78 l15.36,-15.36 h48 l-15.36,15.36 Z" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><path d="M424,78 l15.36,-15.36 v48 l-15.36,15.36 Z" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><rect x="376.0" y="78.0" width="48.0" height="48.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="406.0" y="152.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">30 g in 10 cm³</text><text x="406.0" y="180.0" font-size="15" fill="#d4600f" text-anchor="middle" font-weight="normal">30 ÷ 10 = 3 g/cm³</text></svg>
