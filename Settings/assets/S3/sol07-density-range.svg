<svg xmlns="http://www.w3.org/2000/svg" width="546" height="171" viewBox="0 0 546 171" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The density must lie strictly between the two</title><desc>The acceptable interval is above 0.80 and below 1.20 grams per cubic centimetre. The option 0.95 lies inside. Both endpoints are excluded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="545" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">The density must lie strictly between the two</text><line x1="51.0" y1="83.0" x2="512.0" y2="83.0" stroke="#57606a" stroke-width="1.5"/><line x1="99.0" y1="83.0" x2="464.0" y2="83.0" stroke="#1a7f37" stroke-width="5"/><circle cx="99.0" cy="83.0" r="5.0" fill="white" stroke="#1a7f37" stroke-width="2"/><text x="99.0" y="113.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">0.80</text><text x="99.0" y="141.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Liquid X</text><circle cx="464.0" cy="83.0" r="5.0" fill="white" stroke="#1a7f37" stroke-width="2"/><text x="464.0" y="113.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">1.20</text><text x="464.0" y="141.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Liquid Y</text><circle cx="235.9" cy="83.0" r="6.0" fill="#1a7f37" stroke="white" stroke-width="1.5"/><text x="235.9" y="65.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">0.95 g/cm³</text><text x="281.0" y="151.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="normal">Sinks in X and rises in Y</text></svg>
