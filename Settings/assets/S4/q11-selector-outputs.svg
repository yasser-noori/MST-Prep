<svg xmlns="http://www.w3.org/2000/svg" width="596" height="181" viewBox="0 0 596 181" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Selector S has two separate outputs</title><desc>The battery positive lead enters selector S. Output U leads to K and output D leads to L then M. Both branches meet the negative return. S connects to just one output at a time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="595" height="180" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Selector S has two separate outputs</text><circle cx="31.0" cy="105.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="110.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><line x1="43.0" y1="105.0" x2="121.0" y2="105.0" stroke="#1f2328" stroke-width="2.6"/><rect x="121.0" y="59.0" width="93.0" height="92.0" rx="6" fill="#f2f4f7" stroke="#57606a" stroke-width="1.4"/><text x="167.0" y="101.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Selector S</text><text x="203.0" y="83.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">U</text><text x="203.0" y="137.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">D</text><circle cx="214.0" cy="78.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><line x1="218.0" y1="78.0" x2="341.0" y2="78.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="354.0" cy="78.0" r="13.0" fill="#fff" stroke="#1f2328" stroke-width="2"/><line x1="349.0" y1="73.0" x2="359.0" y2="83.0" stroke="#1f2328" stroke-width="1.6"/><line x1="349.0" y1="83.0" x2="359.0" y2="73.0" stroke="#1f2328" stroke-width="1.6"/><text x="354.0" y="59.0" font-size="13" fill="#1f2