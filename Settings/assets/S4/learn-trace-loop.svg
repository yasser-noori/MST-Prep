<svg xmlns="http://www.w3.org/2000/svg" width="583" height="229" viewBox="0 0 583 229" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Trace the whole route between the terminals</title><desc>Two versions of a one-switch circuit. A closed switch gives a complete path through the lit lamp. An open switch leaves a break after the dark lamp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="582" height="228" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Trace the whole route between the terminals</text><circle cx="31.0" cy="77.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="82.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><circle cx="552.0" cy="77.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="552.0" y="82.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><line x1="43.0" y1="77.0" x2="189.0" y2="77.0" stroke="#1f6feb" stroke-width="2.6"/><circle cx="202.0" cy="77.0" r="13.0" fill="#ffe6d2" stroke="#1f6feb" stroke-width="2"/><line x1="197.0" y1="72.0" x2="207.0" y2="82.0" stroke="#1f6feb" stroke-width="1.6"/><line x1="197.0" y1="82.0" x2="207.0" y2="72.0" stroke="#1f6feb" stroke-width="1.6"/><text x="202.0" y="58.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Lamp lit</text><line x1="215.0" y1="77.0" x2="370.0" y2="77.0" stroke="#1f6feb" stroke-width="2.6"/><line x1="370.0" y1="77.0" x2="402.0" y2="77.0" stroke="#1f6feb" stroke-width="2.6"/><circle cx="370.0" cy="77.0" r="3.5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/><circle cx="402.0" cy="77.0" r="3.5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/><text x="386.0" y