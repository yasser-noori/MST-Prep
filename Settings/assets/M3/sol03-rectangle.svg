<svg xmlns="http://www.w3.org/2000/svg" width="520" height="227" viewBox="0 0 520 227" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Use one length and one width</title><desc>Half the perimeter is 25 cm. Removing the extra 3 cm from the length leaves two equal widths totalling 22 cm. Each width is 11 cm, so the length is 14 cm.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="226" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Use one length and one width</text><rect x="46.0" y="78.0" width="185.0" height="43.0" rx="0" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="138.5" y="105.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Width</text><rect x="231.0" y="78.0" width="185.0" height="43.0" rx="0" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="323.5" y="105.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Width</text><rect x="416.0" y="78.0" width="58.0" height="43.0" rx="0" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="445.0" y="105.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">3 cm</text><path d="M231,62 v7 H474 v-7" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/><text x="352.5" y="90.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal"></text><text x="352.5" y="60.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Length</text><path d="M46,132 v7 H474 v-7" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/><text x="260.0" y="160.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">25 cm = half the perimeter</text><text x="260.0" y="197.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">Width = (25 − 3) ÷ 2 = 11 cm  ·  Length = 14 cm</text></svg>
