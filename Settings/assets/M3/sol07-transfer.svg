<svg xmlns="http://www.w3.org/2000/svg" width="530" height="157" viewBox="0 0 530 157" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Undo the transfer</title><desc>Mina had 22 and Dev had 14. Moving 4 makes both piles 18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="529" height="156" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Undo the transfer</text><text x="26.0" y="69.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Before</text><rect x="98.0" y="46.0" width="158.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="177.0" y="70.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Mina: 22</text><rect x="365.0" y="46.0" width="138.0" height="38.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="434.0" y="70.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Dev: 14</text><text x="26.0" y="120.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">After</text><rect x="98.0" y="97.0" width="158.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="177.0" y="121.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Mina: 18</text><rect x="365.0" y="97.0" width="138.0" height="38.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="434.0" y="121.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Dev: 18</text><line x1="263.0" y1="65.0" x2="357.0" y2="65.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="310.0" y="55.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Move 4</text></svg>
