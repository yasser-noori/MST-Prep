<svg xmlns="http://www.w3.org/2000/svg" width="520" height="290" viewBox="0 0 520 290" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The rental prices cross at 4 hours</title><desc>Loop starts at 16 dollars and adds 2 per hour. Wheel starts at 4 dollars and adds 5 per hour. Their lines cross at four hours and 24 dollars.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="289" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">The rental prices cross at 4 hours</text><line x1="61.0" y1="236.0" x2="425.0" y2="236.0" stroke="#d0d7de" stroke-width="1.5"/><text x="53.0" y="241.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="normal">0</text><line x1="61.0" y1="218.0" x2="425.0" y2="218.0" stroke="#d0d7de" stroke-width="1.5"/><text x="53.0" y="223.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="normal">4</text><line x1="61.0" y1="164.0" x2="425.0" y2="164.0" stroke="#d0d7de" stroke-width="1.5"/><text x="53.0" y="169.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="normal">16</text><line x1="61.0" y1="128.0" x2="425.0" y2="128.0" stroke="#d0d7de" stroke-width="1.5"/><text x="53.0" y="133.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="normal">24</text><line x1="61.0" y1="74.0" x2="425.0" y2="74.0" stroke="#d0d7de" stroke-width="1.5"/><text x="53.0" y="79.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="normal">36</text><line x1="61.0" y1="236.0" x2="425.0" y2="236.0" stroke="#1f2328" stroke-width="1.8"/><line x1="61.0" y1="236.0" x2="61.0" y2="69.0" stroke="#1f2328" stroke-width="1.8"/><text x="43.0" y="58.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">$</text><text x="61