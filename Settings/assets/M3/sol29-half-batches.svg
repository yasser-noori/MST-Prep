<svg xmlns="http://www.w3.org/2000/svg" width="520" height="194" viewBox="0 0 520 194" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count in half-batches</title><desc>The first and second full batches each contain two half-batches. The final half-batch makes five equal parts, and 450 grams divided by five is 90 grams.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="193" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Count in half-batches</text><rect x="36.0" y="80.0" width="84.0" height="38.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="78.0" y="104.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">½ batch</text><rect x="127.0" y="80.0" width="84.0" height="38.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="169.0" y="104.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">½ batch</text><rect x="218.0" y="80.0" width="84.0" height="38.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="260.0" y="104.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">½ batch</text><rect x="309.0" y="80.0" width="84.0" height="38.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="351.0" y="104.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">½ batch</text><rect x="400.0" y="80.0" width="84.0" height="38.0" rx="5" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="442.0" y="104.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">½ batch</text><text x="123.0" y="68.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Batch 1</text><text x="305.0" y="68.0" 