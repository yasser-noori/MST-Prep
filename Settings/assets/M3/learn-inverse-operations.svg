<svg xmlns="http://www.w3.org/2000/svg" width="520" height="244" viewBox="0 0 520 244" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Undo operations on both sides</title><desc>The three equations keep both sides equal. Add 4 to both sides of 3n minus 4 equals 11, then divide both sides of 3n equals 15 by 3 to get n equals 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="243" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Undo operations on both sides</text><text x="322.0" y="60.0" font-size="15" fill="#57606a" text-anchor="start" font-weight="bold">Undo step</text><rect x="30.0" y="68.0" width="115.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="87.5" y="91.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">3n − 4</text><text x="163.0" y="91.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">=</text><rect x="185.0" y="68.0" width="115.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="242.5" y="91.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">11</text><text x="322.0" y="91.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold"></text><rect x="30.0" y="120.0" width="115.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="87.5" y="143.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">3n</text><text x="163.0" y="143.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">=</text><rect x="185.0" y="120.0" width="115.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="242.5" y="143.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">15</text><text x="322.0" y="143.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Add 4 to both</text><rect x="30.0" y="172.0" width="115.0" height="36.0" rx="5" fill="#dcf5e3" stroke="#1f2328" stroke-width="1.5"/><text x="87.5" y="195.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">n</text><text x="163.0" y="195.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">=</text><rect x="185.0" y="172.0" width="115.0" height="36.0" rx="5" fill="#dcf5e3" stroke="#1f2328" stroke-width="1.5"/><text x="242.5" y="195.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">5</text><text x="322.0" y="195.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Divide both by 3</text></svg>
