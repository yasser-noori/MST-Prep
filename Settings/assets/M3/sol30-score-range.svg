<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 520 218" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Which third marks leave 8 and 11?</title><desc>The two kept marks total 19. The whole numbers 0 through 8 let the kept marks remain 8 and 11. From 9 through 20, the third mark is kept instead of 8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="217" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Which third marks leave 8 and 11?</text><rect x="28.0" y="93.0" width="198.0" height="40.0" rx="6" fill="#dcf5e3" stroke="none" stroke-width="1.5"/><line x1="37.0" y1="113.0" x2="477.0" y2="113.0" stroke="#1f2328" stroke-width="2"/><line x1="37.0" y1="109.0" x2="37.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><text x="37.0" y="147.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">0</text><line x1="59.0" y1="109.0" x2="59.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="81.0" y1="109.0" x2="81.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="103.0" y1="109.0" x2="103.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="125.0" y1="109.0" x2="125.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><text x="125.0" y="147.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text><line x1="147.0" y1="109.0" x2="147.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="169.0" y1="109.0" x2="169.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="191.0" y1="109.0" x2="191.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><line x1="213.0" y1="109.0" x2="213.0" y2="117.0" stroke="#1f2328" stroke-width="1.5"/><text x="213.0" y="147.0" font-size