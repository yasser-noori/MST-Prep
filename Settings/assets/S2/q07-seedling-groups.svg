<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Seedling groups after three weeks</title><desc>Sixty seeds from one parent are randomly assigned to two groups of 30. At the same soil, water and temperature, the bright group averages 12 cm and the dim group averages 7 cm.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="619" height="259" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Seedling groups after three weeks</text><rect x="187.0" y="46.0" width="246.0" height="43.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="310.0" y="64.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">60 seeds from one parent</text><text x="310.0" y="80.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">Random split</text><line x1="310.0" y1="91.0" x2="163.0" y2="118.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310.0" y1="91.0" x2="457.0" y2="118.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44.0" y="121.0" width="238.0" height="78.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="56.0" y="145.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Bright light · 30 seedlings</text><rect x="56.0" y="157.0" width="156.0" height="24.0" rx="3" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="218.0" y="175.0" font-size="14" fill="#1f6feb" text-anchor="start" font-weight="bold">12 cm</text><rect x="338.0" y="121.0" width="238.0" height="78.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="350.0" y="145.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Dim light · 30 seedlings</text><rect x="350.0" y="157.0" width="91.0" height="24.0" rx="3" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="447.0" y="175.0" font-size="14" fill="#d4600f" text-anchor="start" font-weight="bold">7 cm</text><text x="310.0" y="231.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Shared conditions: soil, water, and temperature</text></svg>
