<svg xmlns="http://www.w3.org/2000/svg" width="628" height="240" viewBox="0 0 628 240" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Design a comparison about water</title><desc>Randomly assign seedlings to groups. Where just water changes and light stays fixed, the comparison can test water. Where water and light both change, their effects are mixed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="627" height="239" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Design a comparison about water</text><rect x="22.0" y="52.0" width="282.0" height="162.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><rect x="324.0" y="52.0" width="282.0" height="162.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="42.0" y="76.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">One factor varies</text><rect x="34.0" y="91.0" width="122.0" height="73.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="95.0" y="110.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">Group 1</text><text x="95.0" y="131.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">More water</text><text x="95.0" y="151.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bright light</text><rect x="165.0" y="91.0" width="122.0" height="73.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="226.0" y="110.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">Group 2</text><text x="226.0" y="131.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">Less water</text><text x="226.0" y="151.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bright light</text><text x="42.0" y="192.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Can test the effect of water</text><text x="344.0" y="76.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Two factors vary</text><rect x="336.0" y="91.0" width="122.0" height="73.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="397.0" y="110.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">Group 1</text><text x="397.0" y="131.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">More water</text><text x="397.0" y="151.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bright light</text><rect x="467.0" y="91.0" width="122.0" height="73.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="528.0" y="110.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">Group 2</text><text x="528.0" y="131.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">Less water</text><text x="528.0" y="151.0" font-size="13" fill="#d4600f" text-anchor="middle" font-weight="normal">Dim light</text><text x="344.0" y="192.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Water and light are mixed</text><text x="23.0" y="231.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Randomly assign seedlings in both comparisons.</text></svg>
