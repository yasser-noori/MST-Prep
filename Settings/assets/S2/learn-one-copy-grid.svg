<svg xmlns="http://www.w3.org/2000/svg" width="630" height="258" viewBox="0 0 630 258" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Use one copy from each parent</title><desc>Rr supplies R or r. The rr parent supplies r in both rows. The four combinations are Rr, rr, Rr, and rr, making two red and two white possibilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="629" height="257" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Use one copy from each parent</text><text x="196.0" y="62.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Copies from the Rr parent</text><text x="30.0" y="103.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Copies</text><text x="30.0" y="120.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">from the</text><text x="30.0" y="137.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">rr parent</text><text x="155.0" y="86.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">R</text><text x="246.0" y="86.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">r</text><text x="111.0" y="122.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">r</text><rect x="121.0" y="95.0" width="68.0" height="36.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="155.0" y="111.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Rr</text><text x="155.0" y="125.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">Red</text><rect x="212.0" y="95.0" width="68.0" height="36.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="246.0" y="111.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">rr</text><text x="246.0" y="125.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">White</text><text x="111.0" y="166.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">r</text><rect x="121.0" y="139.0" width="68.0" height="36.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="155.0" y="155.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Rr</text><text x="155.0" y="169.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">Red</text><rect x="212.0" y="139.0" width="68.0" height="36.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="246.0" y="155.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">rr</text><text x="246.0" y="169.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">White</text><rect x="329.0" y="71.0" width="275.0" height="123.0" rx="8" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="352.0" y="100.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Four equally likely combinations</text><text x="352.0" y="129.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">2 of 4 have Rr → red</text><text x="352.0" y="156.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">2 of 4 have rr → white</text><text x="29.0" y="226.0" font-size="15" fill="#57606a" text-anchor="start" font-weight="normal">For the white offspring, both parents supplied r.</text></svg>
