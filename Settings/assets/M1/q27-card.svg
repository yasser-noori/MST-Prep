<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One card, 6 cm by 10 cm</title><desc>A single rectangular card 10 cm wide and 6 cm tall.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="419" height="199" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">M1-Q27: one card</text><rect x="120.0" y="70.0" width="144.0" height="86.4" rx="3" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="192.0" y="60.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">10 cm</text><text x="110.0" y="118.2" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">6 cm</text><text x="20.0" y="186.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Cards are placed side by side, all facing the same way.</text></svg>
