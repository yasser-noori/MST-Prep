<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Building up to a shared total: LCM</title><desc>Multiples of 18 (18, 36, 54, 72, 90) and of 30 (30, 60, 90) first match at 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="679" height="259" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Building up to a shared total: LCM</text><rect x="637.0" y="58.0" width="26.0" height="98.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="20.0" y="85.0" font-size="14" fill="#1f6feb" text-anchor="start" font-weight="bold">packs of 18</text><line x1="150.0" y1="80.0" x2="650.0" y2="80.0" stroke="#d0d7de" stroke-width="1"/><circle cx="150.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><circle cx="250.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="250.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">18</text><circle cx="350.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="350.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">36</text><circle cx="450.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="450.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">54</text><circle cx="550.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="550.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">72</text><circle cx="650.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="650.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">90</text><text x="20.0" y="131.0" font-size="14" fill="#d4600f" text-anchor="start" font-weight="bold">packs of 30</text><line x1="150.0" y1="126.0" x2="650.0" y2="126.0" stroke="#d0d7de" stroke-width="1"/><circle cx="150.0" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><circle cx="316.7" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="316.7" y="114.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="normal">30</text><circle cx="483.3" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="483.3" y="114.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="normal">60</text><circle cx="650.0" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="650.0" y="114.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="normal">90</text><line x1="150.0" y1="170.0" x2="650.0" y2="170.0" stroke="#57606a" stroke-width="1.5"/><line x1="150.0" y1="166.0" x2="150.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="250.0" y1="166.0" x2="250.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="316.7" y1="166.0" x2="316.7" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="350.0" y1="166.0" x2="350.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="450.0" y1="166.0" x2="450.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="483.3" y1="166.0" x2="483.3" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="550.0" y1="166.0" x2="550.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="650.0" y1="166.0" x2="650.0" y2="174.0" stroke="#57606a" stroke-width="1"/><text x="150.0" y="190.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">0</text><text x="650.0" y="190.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="bold">90</text><text x="650.0" y="206.0" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal">tiles</text><text x="20.0" y="244.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">First match: 90 = LCM(18, 30).  That is 5 packs of 18 and 3 packs of 30.</text></svg>
