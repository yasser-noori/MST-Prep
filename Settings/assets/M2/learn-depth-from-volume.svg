<svg xmlns="http://www.w3.org/2000/svg" width="520" height="228" viewBox="0 0 520 228" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Spread the volume across the base</title><desc>A base of 8 cm by 5 cm has area 40 square centimetres. A volume of 120 cubic centimetres makes a layer 3 cm deep.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="227" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Spread the volume across the base</text><rect x="48.0" y="114.0" width="126.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><path d="M48,114 l45,-26 h126 l-45,26 Z" fill="#b9d6ff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M174,114 l45,-26 v48 l-45,26 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><text x="111.0" y="144.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">120 cm³</text><line x1="48.0" y1="175.0" x2="174.0" y2="175.0" stroke="#57606a" stroke-width="1.5"/><line x1="48.0" y1="179.0" x2="48.0" y2="171.0" stroke="#57606a" stroke-width="1.5"/><line x1="174.0" y1="179.0" x2="174.0" y2="171.0" stroke="#57606a" stroke-width="1.5"/><text x="111.0" y="196.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">8 cm</text><line x1="181.0" y1="173.0" x2="226.0" y2="147.0" stroke="#57606a" stroke-width="1.5"/><line x1="183.0" y1="176.5" x2="179.0" y2="169.5" stroke="#57606a" stroke-width="1.5"/><line x1="228.0" y1="150.5" x2="224.0" y2="143.5" stroke="#57606a" stroke-width="1.5"/><text x="213.0" y="180.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">5 cm</text><line x1="33.0" y1="114.0" x2="33.0" y2="162.0" stroke="#57606a" stroke-width="1.5"/><line x1="29.0" y1="114.0" x2="37.0" y2="114.0" stroke="#57606a" stroke-width="1.5"/><line x1="29.0" y1="162.0" x2="37.0" y2="162.0" stroke="#57606a" stroke-width="1.5"/><text x="18.0" y="143.0" font-size="17" fill="#174ea6" text-anchor="middle" font-weight="bold">?</text><line x1="271.0" y1="65.0" x2="271.0" y2="196.0" stroke="#d0d7de" stroke-width="1.5"/><text x="291.0" y="91.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Base area = 8 × 5 = 40 cm²</text><text x="291.0" y="124.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Depth = volume ÷ base area</text><rect x="289.0" y="143.0" width="201.0" height="40.0" rx="6" fill="#ddeaff" stroke="none" stroke-width="1.5"/><text x="389.0" y="169.0" font-size="17" fill="#174ea6" text-anchor="middle" font-weight="bold">120 ÷ 40 = 3 cm</text></svg>
