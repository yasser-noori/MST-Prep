<svg xmlns="http://www.w3.org/2000/svg" width="520" height="236" viewBox="0 0 520 236" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Same base, three heights</title><desc>The water depth reaches the surface, the gap runs from the surface to the rim, and the full inside height runs from the bottom to the rim.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="235" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Same base, three heights</text><rect x="36.0" y="66.0" width="168.0" height="72.0" rx="0" fill="#fff4df" stroke="none" stroke-width="1.5"/><rect x="36.0" y="138.0" width="168.0" height="55.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M36,66 V193 H204 V66" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="36.0" y1="138.0" x2="204.0" y2="138.0" stroke="#1f6feb" stroke-width="2"/><text x="120.0" y="109.0" font-size="16" fill="#93400d" text-anchor="middle" font-weight="bold">Empty space</text><text x="120.0" y="171.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Water present</text><line x1="206.0" y1="66.0" x2="274.0" y2="66.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="206.0" y1="138.0" x2="274.0" y2="138.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="206.0" y1="193.0" x2="274.0" y2="193.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="221.0" y1="66.0" x2="221.0" y2="138.0" stroke="#57606a" stroke-width="1.5"/><line x1="217.0" y1="66.0" x2="225.0" y2="66.0" stroke="#57606a" stroke-width="1.5"/><line x1="217.0" y1="138.0" x2="225.0" y2="138.0" stroke="#57606a" stroke-width="1.5"/><line x1="221.0" y1="138.0" x2="221.0" y2="193.0" stroke="#57606a" stroke-width="1.5"/><line x1="217.0" y1="138.0" x2="225.0" y2="138.0" stroke="#57606a" stroke-width="1.5"/><line x1="217.0" y1="193.0" x2="225.0" y2="193.0" stroke="#57606a" stroke-width="1.5"/><line x1="274.0" y1="66.0" x2="274.0" y2="193.0" stroke="#57606a" stroke-width="1.5"/><line x1="270.0" y1="66.0" x2="278.0" y2="66.0" stroke="#57606a" stroke-width="1.5"/><line x1="270.0" y1="193.0" x2="278.0" y2="193.0" stroke="#57606a" stroke-width="1.5"/><text x="230.0" y="108.0" font-size="14" fill="#93400d" text-anchor="start" font-weight="bold">Gap</text><text x="230.0" y="169.0" font-size="14" fill="#174ea6" text-anchor="start" font-weight="bold">Depth</text><text x="285.0" y="126.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Full inside height</text><text x="285.0" y="147.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">Use for total capacity</text><text x="260.0" y="219.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Water present + empty space = total capacity</text></svg>
