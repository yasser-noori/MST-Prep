<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Double each edge</title><desc>Doubling each edge doubles length. A two-by-two square contains four unit squares, and a two-by-two-by-two cube contains eight unit cubes in two layers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="249" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Double each edge</text><line x1="176.0" y1="61.0" x2="176.0" y2="222.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="344.0" y1="61.0" x2="344.0" y2="222.0" stroke="#d0d7de" stroke-width="1.5"/><text x="92.0" y="72.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Length</text><text x="92.0" y="216.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">2 unit lengths</text><text x="260.0" y="72.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Area</text><text x="260.0" y="216.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">4 unit squares</text><text x="428.0" y="72.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Volume</text><text x="428.0" y="216.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">8 unit cubes</text><line x1="40.0" y1="142.0" x2="92.0" y2="142.0" stroke="#1f6feb" stroke-width="5"/><line x1="92.0" y1="142.0" x2="144.0" y2="142.0" stroke="#1f6feb" stroke-width="5"/><line x1="40.0" y1="133.0" x2="40.0" y2="151.0" stroke="#1f2328" stroke-width="2"/><line x1="92.0" y1="133.0" x2="92.0" y2="151.0" stroke="#1f2328" stroke-width="2"/><line x1="144.0" y1="133.0" x2="144.0" y2="151.0" stroke="#1f2328" stroke