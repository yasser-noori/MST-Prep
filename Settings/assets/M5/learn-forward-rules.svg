<svg xmlns="http://www.w3.org/2000/svg" width="588" height="208" viewBox="0 0 588 208" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Test each rule with the same inputs</title><desc>At least one and exactly one both pass with one ON input. With two ON inputs, at least one and both pass, while exactly one fails.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="587" height="207" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Test each rule with the same inputs</text><rect x="24.0" y="49.0" width="106.0" height="34.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="77.0" y="71.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">ON inputs</text><rect x="134.0" y="49.0" width="142.0" height="34.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="205.0" y="71.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">At least one</text><rect x="280.0" y="49.0" width="141.0" height="34.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="350.5" y="71.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Exactly one</text><rect x="425.0" y="49.0" width="119.0" height="34.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="484.5" y="71.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Both</text><rect x="24.0" y="87.0" width="106.0" height="34.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="77.0" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">0</text><rect x="134.0" y="87.0" width="142.0" height="34.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text