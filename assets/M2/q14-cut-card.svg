<svg xmlns="http://www.w3.org/2000/svg" width="520" height="246" viewBox="0 0 520 246" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Card with a semicircle cut out</title><desc>The original sheet is 14 cm by 10 cm. A semicircle whose diameter is the right edge has been removed. The tinted area is the card remaining.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="245" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Card with a semicircle cut out</text><path d="M109,58 H312 A72.5,72.5 0 0 0 312,203 H109 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="312.0" y1="58.0" x2="312.0" y2="203.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="176.0" y="135.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Card left</text><text x="278.0" y="135.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Cut out</text><line x1="336.0" y1="58.0" x2="336.0" y2="203.0" stroke="#57606a" stroke-width="1.5"/><line x1="332.0" y1="58.0" x2="340.0" y2="58.0" stroke="#57606a" stroke-width="1.5"/><line x1="332.0" y1="203.0" x2="340.0" y2="203.0" stroke="#57606a" stroke-width="1.5"/><text x="347.0" y="136.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">10 cm</text><line x1="109.0" y1="217.0" x2="312.0" y2="217.0" stroke="#57606a" stroke-width="1.5"/><line x1="109.0" y1="221.0" x2="109.0" y2="213.0" stroke="#57606a" stroke-width="1.5"/><line x1="312.0" y1="221.0" x2="312.0" y2="213.0" stroke="#57606a" stroke-width="1.5"/><text x="210.5" y="237.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">14 cm</text></svg>
