<svg xmlns="http://www.w3.org/2000/svg" width="520" height="246" viewBox="0 0 520 246" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The same water covers a different base</title><desc>The bottle contains 1130.4 cubic centimetres. The tray base is 376.8 square centimetres, so the water reaches a depth of 3 cm.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="245" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">The same water covers a different base</text><path d="M71,88 V171 a36,9.0 0 0 0 72,0 V88" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="107" cy="88" rx="36" ry="9.0" fill="#b9d6ff" stroke="#1f6feb"/><path d="M71,88 V171 a36,9.0 0 0 0 72,0 V88" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><ellipse cx="107" cy="88" rx="36" ry="9.0" fill="none" stroke="#1f2328" stroke-width="2"/><path d="M295,146 l37,-30 h119 l-37,30 Z" fill="white" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M312.26666666666665,146 L332,130 H433.73333333333335 L414,146 Z" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5" stroke-linejoin="round"/><path d="M295,146 H414 v14 h-119 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M414,146 l37,-30 v14 l-37,30 Z" fill="#b9d6ff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><line x1="178.0" y1="117.0" x2="269.0" y2="117.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><text x="224.0" y="103.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Pour</text><text x="107.0" y="61.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Full bottle</text><text x="374.0" y="89.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Water in tray</text><text x="107.0" y="207.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Volume = 1130.4 cm³</text><text x="374.0" y="188.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Base area = 376.8 cm²</text><text x="374.0" y="222.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">1130.4 ÷ 376.8 = 3 cm deep</text></svg>
