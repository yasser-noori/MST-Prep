<svg xmlns="http://www.w3.org/2000/svg" width="520" height="258" viewBox="0 0 520 258" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Window and metal frame</title><desc>A semicircle sits on top of an 8 cm wide and 10 cm tall rectangle. The semicircle and rectangle share the rectangle&#x27;s top side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="257" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Window and metal frame</text><path d="M104,105 a48,48 0 0 1 96,0 V225 H104 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="104.0" y1="105.0" x2="200.0" y2="105.0" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="86.0" y1="105.0" x2="86.0" y2="225.0" stroke="#57606a" stroke-width="1.5"/><line x1="82.0" y1="105.0" x2="90.0" y2="105.0" stroke="#57606a" stroke-width="1.5"/><line x1="82.0" y1="225.0" x2="90.0" y2="225.0" stroke="#57606a" stroke-width="1.5"/><text x="52.0" y="168.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">10 cm</text><line x1="104.0" y1="232.0" x2="200.0" y2="232.0" stroke="#57606a" stroke-width="1.5"/><line x1="104.0" y1="236.0" x2="104.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><line x1="200.0" y1="236.0" x2="200.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><text x="152.0" y="251.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">8 cm</text><text x="231.0" y="81.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Semicircle</text><text x="231.0" y="154.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Rectangle</text></svg>
