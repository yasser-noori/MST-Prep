<svg xmlns="http://www.w3.org/2000/svg" width="520" height="238" viewBox="0 0 520 238" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Trace all six outside edges</title><desc>Top 12 m, right 5 m, bottom 7 m, left 8 m. The missing horizontal and vertical edges are 5 m and 3 m.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="237" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Trace all six outside edges</text><path d="M129,67 H333 V152 H248 V203 H129 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><text x="231.0" y="58.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">12 m</text><text x="359.0" y="113.5" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">5 m</text><text x="188.5" y="227.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">7 m</text><text x="101.0" y="139.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">8 m</text><path d="M333,152 H248 V203" fill="none" stroke="#d4600f" stroke-width="3" stroke-linejoin="round"/><text x="261.0" y="174.0" font-size="16" fill="#93400d" text-anchor="start" font-weight="bold">12 − 7 = 5 m</text><text x="261.0" y="196.0" font-size="16" fill="#93400d" text-anchor="start" font-weight="bold">8 − 5 = 3 m</text></svg>
