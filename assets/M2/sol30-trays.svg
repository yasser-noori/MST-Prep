<svg xmlns="http://www.w3.org/2000/svg" width="520" height="245" viewBox="0 0 520 245" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare the folded trays</title><desc>Ada&#x27;s base is 14 cm by 8 cm and the sides are 2 cm high, giving 224 cubic centimetres. Nico&#x27;s base is 12 cm by 6 cm and the sides are 3 cm high, giving 216 cubic centimetres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="244" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Compare the folded trays</text><path d="M37,127 l40,-32 h140 l-40,32 Z" fill="white" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M54.5,127 L77,109 H199.5 L177,127 Z" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5" stroke-linejoin="round"/><path d="M37,127 H177 v14 h-140 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M177,127 l40,-32 v14 l-40,32 Z" fill="#b9d6ff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><text x="127.0" y="65.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Ada</text><text x="127.0" y="169.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Base 14 × 8 cm · height 2 cm</text><text x="127.0" y="196.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">14 × 8 × 2 = 224 cm³</text><path d="M304,127 l30,-24 h120 l-30,24 Z" fill="white" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M330.25,127 L334,124 H427.75 L424,127 Z" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5" stroke-linejoin="round"/><path d="M304,127 H424 v21 h-120 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><path d="M424,127 l30,-24 v21 l-30,24 Z" fill="#b9d6ff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><text x="394.0" y="65.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Nico</text><text x="394.0" y="169.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Base 12 × 6 cm · height 3 cm</text><text x="394.0" y="196.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">12 × 6 × 3 = 216 cm³</text><text x="260.0" y="227.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">Ada’s holds 8 cm³ more.</text></svg>
