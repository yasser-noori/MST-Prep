<svg xmlns="http://www.w3.org/2000/svg" width="520" height="244" viewBox="0 0 520 244" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Two lengths, two measurements</title><desc>The diameter spans the whole circle through the centre and is twice the radius. The circumference follows the rim. Area covers the shaded interior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="243" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Two lengths, two measurements</text><text x="135.0" y="62.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Radius and diameter</text><text x="385.0" y="62.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Circumference and area</text><line x1="260.0" y1="55.0" x2="260.0" y2="221.0" stroke="#d0d7de" stroke-width="1.5"/><circle cx="135.0" cy="128.0" r="49.0" fill="#f2f4f7" stroke="#57606a" stroke-width="1.5"/><line x1="86.0" y1="128.0" x2="184.0" y2="128.0" stroke="#1f6feb" stroke-width="3"/><line x1="135.0" y1="128.0" x2="135.0" y2="79.0" stroke="#d4600f" stroke-width="3"/><circle cx="86.0" cy="128.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><circle cx="135.0" cy="128.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><circle cx="184.0" cy="128.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><circle cx="135.0" cy="79.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><text x="145.0" y="108.0" font-size="17" fill="#93400d" text-anchor="start" font-weight="bold">r</text><text x="135.0" y="154.0" font-size="17" fill="#174ea6" text-anchor="middle" font-weight="bold">d</text><text x="135.0" y="215.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">d = 2 × r</text><circle cx="385.0" cy="128.0" r="49.0" fill="#ddeaff" stroke="#1f2328" stroke-width="4"/><text x="385.0" y="134.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Area</text><path d="M432,115 L451,99 H485" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><text x="451.0" y="92.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Rim</text><text x="385.0" y="201.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Around → cm</text><text x="385.0" y="224.0" font-size="15" fill="#174ea6" text-anchor="middle" font-weight="bold">Inside → cm²</text></svg>
