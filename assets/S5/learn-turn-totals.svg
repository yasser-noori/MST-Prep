<svg xmlns="http://www.w3.org/2000/svg" width="560" height="135" viewBox="0 0 560 135" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Add the turning effects on each side</title><desc>Two loads on the left contribute 9 and 3 N-marks. Their sum, 12, matches a single 12 N-mark turn on the right.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="134" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="29.0" y="37.0" font-size="16" fill="#1f6feb" text-anchor="start" font-weight="bold">Left turns</text><text x="29.0" y="99.0" font-size="16" fill="#d4600f" text-anchor="start" font-weight="bold">Right turn</text><rect x="135.0" y="21.0" width="234.0" height="30.0" rx="3" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="252.0" y="41.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">9 N-marks</text><rect x="369.0" y="21.0" width="78.0" height="30.0" rx="3" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="408.0" y="41.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">3 N-marks</text><rect x="135.0" y="83.0" width="312.0" height="30.0" rx="3" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="291.0" y="103.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">12 N-marks</text><line x1="447.0" y1="52.0" x2="447.0" y2="82.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 4"/><text x="500.0" y="72.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">Equal</text></svg>
