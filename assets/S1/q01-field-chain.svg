<svg xmlns="http://www.w3.org/2000/svg" width="520" height="106" viewBox="0 0 520 106" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Who eats whom in the field</title><desc>Seeds are eaten by mice, mice by snakes, and snakes by hawks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="105" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Who eats whom in the field</text><rect x="18.0" y="48.0" width="99.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="67.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Seeds</text><line x1="119.0" y1="67.0" x2="136.0" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="139.0" y="48.0" width="99.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="188.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Mouse</text><line x1="240.0" y1="67.0" x2="257.0" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="260.0" y="48.0" width="99.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="309.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Snake</text><line x1="361.0" y1="67.0" x2="378.0" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="381.0" y="48.0" width="99.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="430.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Hawk</text></svg>
