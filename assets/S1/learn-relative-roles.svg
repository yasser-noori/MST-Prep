<svg xmlns="http://www.w3.org/2000/svg" width="600" height="158" viewBox="0 0 600 158" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One animal can fill both roles</title><desc>A grasshopper is eaten by a frog, and the frog is eaten by a heron. The frog is a predator of the grasshopper and prey of the heron.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="157" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">One animal can fill both roles</text><line x1="158.0" y1="90.0" x2="234.0" y2="90.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="366.0" y1="90.0" x2="442.0" y2="90.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38.0" y="73.0" width="114.0" height="34.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="95.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Grasshopper</text><rect x="240.0" y="73.0" width="120.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="300.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Frog</text><rect x="448.0" y="73.0" width="114.0" height="34.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="505.0" y="95.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Heron</text><text x="198.0" y="69.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Frog is predator</text><text x="402.0" y="69.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Frog is prey</text><text x="22.0" y="144.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Read each arrow as “is eaten by.”</text></svg>
