<svg xmlns="http://www.w3.org/2000/svg" width="600" height="134" viewBox="0 0 600 134" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lake food chain</title><desc>Phytoplankton are eaten by zooplankton, which are eaten by small fish. Large fish eat small fish.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="133" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Lake food chain</text><line x1="144.0" y1="76.0" x2="171.0" y2="76.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="286.0" y1="76.0" x2="313.0" y2="76.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="426.0" y1="76.0" x2="453.0" y2="76.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="29.0" y="59.0" width="112.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="85.0" y="81.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Phytoplankton</text><rect x="174.0" y="59.0" width="110.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="229.0" y="81.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Zooplankton</text><rect x="314.0" y="59.0" width="110.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="369.0" y="81.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Small fish</text><rect x="454.0" y="59.0" width="110.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="509.0" y="81.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Large fish</text><text x="22.0" y="120.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Feeding arrows point from food to eater.</text></svg>
