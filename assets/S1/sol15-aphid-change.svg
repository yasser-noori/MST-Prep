<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare each week with the previous week</title><desc>The aphid counts from week 1 to week 5 are 200, 260, 300, 180 and 90. The four changes are plus 60, plus 40, minus 120 and minus 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="219" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Compare each week with the previous week</text><text x="22.0" y="76.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Aphids</text><text x="98.0" y="58.0" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal">350</text><text x="98.0" y="137.0" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal">0</text><line x1="113.0" y1="133.0" x2="558.0" y2="133.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="113.0" y1="54.0" x2="558.0" y2="54.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="113.0" y1="54.0" x2="113.0" y2="133.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="113.0" y1="87.9" x2="224.2" y2="74.3" stroke="#1f6feb" stroke-width="2.5"/><line x1="224.2" y1="74.3" x2="335.5" y2="65.3" stroke="#1f6feb" stroke-width="2.5"/><line x1="335.5" y1="65.3" x2="446.8" y2="92.4" stroke="#1f6feb" stroke-width="2.5"/><line x1="446.8" y1="92.4" x2="558.0" y2="112.7" stroke="#1f6feb" stroke-width="2.5"/><circle cx="113.0" cy="87.9" r="4.2" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/><text x="113.0" y="79.9" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">200</text><circle cx="224.2" cy="74.3" r="4.2" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/><text x