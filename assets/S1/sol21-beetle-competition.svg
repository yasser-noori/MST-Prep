<svg xmlns="http://www.w3.org/2000/svg" width="600" height="239" viewBox="0 0 600 239" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare each species with its own tank</title><desc>Red beetles finish at 200 alone and 120 together, 80 fewer. Grey beetles finish at 180 alone and 40 together, 140 fewer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="238" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Compare each species with its own tank</text><text x="22.0" y="63.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Red beetles</text><text x="126.0" y="66.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Alone</text><rect x="195.0" y="52.0" width="268.0" height="19.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="472.0" y="66.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">200</text><text x="126.0" y="94.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Together</text><rect x="195.0" y="80.0" width="160.8" height="19.0" rx="4" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="364.8" y="94.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">120</text><text x="510.0" y="83.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">80 fewer</text><text x="22.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Grey beetles</text><text x="126.0" y="151.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Alone</text><rect x="195.0" y="137.0" width="241.2" height="19.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="445.2" y="151.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">180</text><text x="126.0" y="179.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Together</text><rect x="195.0" y="165.0" width="53.6" height="19.0" rx="4" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="257.6" y="179.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">40</text><text x="510.0" y="168.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">140 fewer</text><text x="22.0" y="225.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Bar lengths use the same scale. Both species started with 50 per occupied tank.</text></svg>
