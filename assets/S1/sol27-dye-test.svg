<svg xmlns="http://www.w3.org/2000/svg" width="650" height="216" viewBox="0 0 650 216" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One population separates the two possibilities</title><desc>Phytoplankton, zooplankton, small fish and large fish are shown in that order. If the dye starts in zooplankton, the results are absent, detected, detected, detected. If it starts in small fish, the results are absent, absent, detected, detected.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="649" height="215" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">One population separates the two possibilities</text><text x="242.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Phytoplankton</text><text x="349.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Zooplankton</text><text x="456.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Small fish</text><text x="563.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Large fish</text><text x="22.0" y="110.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Starts in zooplankton</text><rect x="194.0" y="88.0" width="96.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="242.0" y="110.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Absent</text><rect x="301.0" y="88.0" width="96.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="349.0" y="110.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Detected</text><rect x="408.0" y="88.0" width="96.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="456.0" y="110.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Detected</text><rect x="515.0" y="88.0" width="96.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="563.0" y="110.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Detected</text><text x="22.0" y="154.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Starts in small fish</text><rect x="194.0" y="132.0" width="96.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="242.0" y="154.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Absent</text><rect x="301.0" y="132.0" width="96.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="349.0" y="154.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Absent</text><rect x="408.0" y="132.0" width="96.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="456.0" y="154.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Detected</text><rect x="515.0" y="132.0" width="96.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="563.0" y="154.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Detected</text><rect x="296.0" y="49.0" width="106.0" height="123.0" rx="8" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="4 3"/><text x="22.0" y="202.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Only the zooplankton result differs between the two starting populations.</text></svg>
