<svg xmlns="http://www.w3.org/2000/svg" width="600" height="242" viewBox="0 0 600 242" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Farmland food web</title><desc>Seeds are eaten by mice and sparrows. Mice are eaten by owls and snakes. Owls also eat snakes and sparrows. Weasels eat sparrows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="241" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Farmland food web</text><line x1="122.0" y1="123.0" x2="174.0" y2="73.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="122.0" y1="131.0" x2="174.0" y2="176.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="270.0" y1="65.0" x2="348.0" y2="65.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="270.0" y1="72.0" x2="310.0" y2="108.0" stroke="#57606a" stroke-width="1.6"/><line x1="310.0" y1="108.0" x2="472.0" y2="108.0" stroke="#57606a" stroke-width="1.6"/><line x1="472.0" y1="108.0" x2="492.0" y2="118.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="452.0" y1="65.0" x2="493.0" y2="104.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="270.0" y1="173.0" x2="340.0" y2="143.0" stroke="#57606a" stroke-width="1.6"/><line x1="340.0" y1="143.0" x2="475.0" y2="143.0" stroke="#57606a" stroke-width="1.6"/><line x1="475.0" y1="143.0" x2="492.0" y2="135.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="270.0" y1="182.0" x2="348.0" y2="182.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26.0" y="110.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="72.0" y="132.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Seeds</text><rect x="176.0" y="51.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="222.0" y="73.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Mouse</text><rect x="176.0" y="161.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="222.0" y="183.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Sparrow</text><rect x="354.0" y="48.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="400.0" y="70.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Snake</text><rect x="354.0" y="165.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="400.0" y="187.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Weasel</text><rect x="494.0" y="108.0" width="92.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="540.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Owl</text><text x="22.0" y="228.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Feeding arrows point from food to eater.</text></svg>
