<svg xmlns="http://www.w3.org/2000/svg" width="600" height="151" viewBox="0 0 600 151" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count high notes on their own</title><desc>High notes at positions 1, 3, 5, 7 and 9 last 3, 5, 7, 9 and 11 beats. Each low note lasts 1 beat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Count high notes on their own</text><rect x="24.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="51.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">3 beats</text><text x="51.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">1</text><rect x="86.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="113.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1 beat</text><text x="113.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">2</text><rect x="148.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="175.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">5 beats</text><text x="175.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">3</text><rect x="210.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="237.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1 beat</text><text x="237.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">4</text><rect x="272.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="299.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">7 beats</text><text x="299.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">5</text><rect x="334.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="361.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1 beat</text><text x="361.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">6</text><rect x="396.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="423.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">9 beats</text><text x="423.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">7</text><rect x="458.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="485.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1 beat</text><text x="485.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">8</text><rect x="520.0" y="60.0" width="54.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="547.0" y="84.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">11 beats</text><text x="547.0" y="51.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">9</text><text x="24.0" y="127.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">High notes occupy odd positions. Their lengths increase by 2 beats each time.</text></svg>
