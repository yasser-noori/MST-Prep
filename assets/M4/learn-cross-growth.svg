<svg xmlns="http://www.w3.org/2000/svg" width="540" height="244" viewBox="0 0 540 244" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Grow four arms around one centre</title><desc>Stage 1 is one tile. Stage 2 has a centre and four one-tile arms. Stage 3 has a centre and four two-tile arms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="243" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Grow four arms around one centre</text><text x="93.0" y="62.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Stage 1</text><rect x="82.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="93.0" y="141.0" font-size="13" fill="#93400d" text-anchor="middle" font-weight="bold">C</text><text x="93.0" y="219.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">1 + 4 × 0 = 1</text><text x="270.0" y="62.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Stage 2</text><rect x="281.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="237.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="259.0" y="147.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="259.0" y="103.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="259.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="270.0" y="141.0" font-size="13" fill="#93400d" text-anchor="middle" font-weight="bold">C</text><text x="270.0" y="219.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">1 + 4 × 1 = 5</text><text x="447.0" y="62.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Stage 3</text><rect x="458.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="414.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="436.0" y="147.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="436.0" y="103.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="480.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="392.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="436.0" y="169.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="436.0" y="81.0" width="22.0" height="22.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="436.0" y="125.0" width="22.0" height="22.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="447.0" y="141.0" font-size="13" fill="#93400d" text-anchor="middle" font-weight="bold">C</text><text x="447.0" y="219.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">1 + 4 × 2 = 9</text></svg>
