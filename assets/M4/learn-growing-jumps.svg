<svg xmlns="http://www.w3.org/2000/svg" width="540" height="192" viewBox="0 0 540 192" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Read the jumps between terms</title><desc>Jumps of 3, 5, 7 and 9 take 2, 5, 10 and 17 to 26. Each jump is two larger than the last.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="191" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Read the jumps between terms</text><rect x="20.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="45.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">2</text><line x1="74.0" y1="92.0" x2="128.5" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="101.2" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">+3</text><rect x="132.5" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="157.5" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">5</text><line x1="186.5" y1="92.0" x2="241.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="213.8" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">+5</text><rect x="245.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="270.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">10</text><line x1="299.0" y1="92.0" x2="353.5" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="326.2" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">+7</text><rect x="357.5" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="382.5" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">17</text><line x1="411.5" y1="92.0" x2="466.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438.8" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">+9</text><rect x="470.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="495.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">26</text><path d="M101.25,114 v17 h112.5 v-17" fill="none" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><text x="157.5" y="151.0" font-size="14" fill="#93400d" text-anchor="middle" font-weight="bold">+2</text><path d="M213.75,114 v17 h112.5 v-17" fill="none" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><text x="270.0" y="151.0" font-size="14" fill="#93400d" text-anchor="middle" font-weight="bold">+2</text><path d="M326.25,114 v17 h112.5 v-17" fill="none" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><text x="382.5" y="151.0" font-size="14" fill="#93400d" text-anchor="middle" font-weight="bold">+2</text><text x="270.0" y="175.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Each jump grows by 2.</text></svg>
