<svg xmlns="http://www.w3.org/2000/svg" width="540" height="158" viewBox="0 0 540 158" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Six positions have five gaps</title><desc>Positions 1 to 6 read 19, 15, 11, 7, 3 and minus 1. Each of the five gaps subtracts 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="157" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Six positions have five gaps</text><text x="45.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 1</text><text x="135.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 2</text><text x="225.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 3</text><text x="315.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 4</text><text x="405.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 5</text><text x="495.0" y="61.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Term 6</text><rect x="20.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="45.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">19</text><line x1="74.0" y1="92.0" x2="106.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="90.0" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">−4</text><rect x="110.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="135.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">15</text><line x1="164.0" y1="92.0" x2="196.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180.0" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">−4</text><rect x="200.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="225.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">11</text><line x1="254.0" y1="92.0" x2="286.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270.0" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">−4</text><rect x="290.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="315.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">7</text><line x1="344.0" y1="92.0" x2="376.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="360.0" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">−4</text><rect x="380.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="405.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">3</text><line x1="434.0" y1="92.0" x2="466.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="83.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">−4</text><rect x="470.0" y="76.0" width="50.0" height="32.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="495.0" y="98.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">−1</text><text x="270.0" y="137.0" font-size="17" fill="#174ea6" text-anchor="middle" font-weight="bold">19 − 5 × 4 = −1</text></svg>
