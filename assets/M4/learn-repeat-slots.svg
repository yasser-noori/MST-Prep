<svg xmlns="http://www.w3.org/2000/svg" width="540" height="199" viewBox="0 0 540 199" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Find the slot inside the repeat</title><desc>Five complete four-symbol blocks use positions 1 through 20. Position 23 is slot 3 of the sixth block.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="198" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Find the slot inside the repeat</text><rect x="31.0" y="60.0" width="78.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="70.0" y="82.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Block 1</text><text x="70.0" y="107.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">1–4</text><rect x="131.0" y="60.0" width="78.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="170.0" y="82.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Block 2</text><text x="170.0" y="107.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">5–8</text><rect x="231.0" y="60.0" width="78.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="270.0" y="82.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Block 3</text><text x="270.0" y="107.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">9–12</text><rect x="331.0" y="60.0" width="78.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="370.0" y="82.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Block 4</text><text x="370.0" y="107.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">13–16</text><rect x="431.0" y="60.0" width="78.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="470.0" y="82.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Block 5</text><text x="470.0" y="107.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">17–20</text><line x1="22.0" y1="122.0" x2="518.0" y2="122.0" stroke="#d0d7de" stroke-width="1.5"/><text x="26.0" y="153.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Next block</text><text x="26.0" y="177.0" font-size="15" fill="#174ea6" text-anchor="start" font-weight="bold">23 = 5 × 4 + 3</text><rect x="179.5" y="133.0" width="63.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="211.0" y="155.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">21</text><text x="211.0" y="181.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Slot 1</text><rect x="263.5" y="133.0" width="63.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="295.0" y="155.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">22</text><text x="295.0" y="181.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Slot 2</text><rect x="347.5" y="133.0" width="63.0" height="32.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="379.0" y="155.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">23</text><text x="379.0" y="181.0" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="normal">Slot 3</text><rect x="431.5" y="133.0" width="63.0" height="32.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="463.0" y="155.0" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">24</text><text x="463.0" y="181.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Slot 4</text><