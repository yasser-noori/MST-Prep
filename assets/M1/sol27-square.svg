<svg xmlns="http://www.w3.org/2000/svg" width="520" height="372" viewBox="0 0 520 372" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>M1-Q27: smallest square from 10 × 6 cards</title><desc>A 30 by 30 square made of cards 10 wide and 6 tall: 3 across and 5 down, 15 cards.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="371" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">M1-Q27: smallest square from 10 cm × 6 cm cards</text><rect x="70.0" y="64.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="70.0" y="112.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="70.0" y="160.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="70.0" y="208.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="70.0" y="256.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="150.0" y="64.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="150.0" y="112.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="150.0" y="160.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="150.0" y="208.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="150.0" y="256.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="230.0" y="64.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="230.0" y="112.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="230.0" y="160.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="230.0" y="208.0" width="80.0" height="48.0" rx="0" fill="#c6dafc" stroke="#1f6feb" stroke-width="1.2"/><rect x="230.0" y="256.0" width="80.0" height="48.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.2"/><rect x="70.0" y="64.0" width="240.0" height="240.0" rx="0" fill="none" stroke="#1f2328" stroke-width="2.5"/><text x="190.0" y="56.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">30 cm</text><text x="60.0" y="189.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">30 cm</text><text x="324.0" y="84.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">3 cards across</text><text x="324.0" y="104.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">(30 ÷ 10)</text><text x="324.0" y="134.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">5 cards down</text><text x="324.0" y="154.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">(30 ÷ 6)</text><text x="20.0" y="354.0" font-size="14" fill="#1a7f37" text-anchor="start" font-weight="bold">Side = LCM(6, 10) = 30 cm → 3 × 5 = 15 cards</text></svg>
