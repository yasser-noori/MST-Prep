<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Factor tree for 180</title><desc>180 splits into 2 × 90, 90 into 2 × 45, 45 into 3 × 15, 15 into 3 × 5, so 180 = 2² × 3² × 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="359" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Factor tree for 180</text><line x1="140.0" y1="80.0" x2="108.0" y2="112.0" stroke="#57606a" stroke-width="1.5"/><line x1="160.0" y1="80.0" x2="202.0" y2="112.0" stroke="#57606a" stroke-width="1.5"/><line x1="200.0" y1="138.0" x2="168.0" y2="170.0" stroke="#57606a" stroke-width="1.5"/><line x1="220.0" y1="138.0" x2="262.0" y2="170.0" stroke="#57606a" stroke-width="1.5"/><line x1="260.0" y1="196.0" x2="228.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><line x1="280.0" y1="196.0" x2="322.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><line x1="320.0" y1="254.0" x2="288.0" y2="286.0" stroke="#57606a" stroke-width="1.5"/><line x1="340.0" y1="254.0" x2="382.0" y2="286.0" stroke="#57606a" stroke-width="1.5"/><text x="150.0" y="75.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">180</text><circle cx="100.0" cy="128.0" r="17.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="100.0" y="133.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">2</text><text x="210.0" y="133.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">90</text><circle cx="160.0" cy="186.0" r="17.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="160.0" y="191.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">2</text><text x="270.0" y="191.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">45</text><circle cx="220.0" cy="244.0" r="17.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="220.0" y="249.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">3</text><text x="330.0" y="249.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">15</text><circle cx="280.0" cy="302.0" r="17.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="280.0" y="307.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">3</text><circle cx="390.0" cy="302.0" r="17.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="390.0" y="307.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">5</text><circle cx="380.0" cy="72.0" r="9.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="2"/><text x="395.0" y="77.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">= prime (stop here)</text><text x="20.0" y="340.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">180 = 2 × 2 × 3 × 3 × 5 = 2² × 3² × 5</text></svg>
