<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>M1-Q26: teeth passing the contact point</title><desc>Gear A completes a turn every 12 teeth and gear B every 18 teeth; both are back at the start after 36 teeth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="679" height="259" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">M1-Q26: teeth passing the contact point</text><rect x="637.0" y="58.0" width="26.0" height="98.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="20.0" y="85.0" font-size="14" fill="#1f6feb" text-anchor="start" font-weight="bold">A full turns</text><line x1="150.0" y1="80.0" x2="650.0" y2="80.0" stroke="#d0d7de" stroke-width="1"/><circle cx="150.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><circle cx="316.7" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="316.7" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">12</text><circle cx="483.3" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="483.3" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">24</text><circle cx="650.0" cy="80.0" r="7.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="650.0" y="68.0" font-size="11" fill="#1f6feb" text-anchor="middle" font-weight="normal">36</text><text x="20.0" y="131.0" font-size="14" fill="#d4600f" text-anchor="start" font-weight="bold">B full turns</text><line x1="150.0" y1="126.0" x2="650.0" y2="126.0" stroke="#d0d7de" stroke-width="1"/><circle cx="150.0" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><circle cx="400.0" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="400.0" y="114.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="normal">18</text><circle cx="650.0" cy="126.0" r="7.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="650.0" y="114.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="normal">36</text><line x1="150.0" y1="170.0" x2="650.0" y2="170.0" stroke="#57606a" stroke-width="1.5"/><line x1="150.0" y1="166.0" x2="150.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="316.7" y1="166.0" x2="316.7" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="166.0" x2="400.0" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="483.3" y1="166.0" x2="483.3" y2="174.0" stroke="#57606a" stroke-width="1"/><line x1="650.0" y1="166.0" x2="650.0" y2="174.0" stroke="#57606a" stroke-width="1"/><text x="150.0" y="190.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">0</text><text x="650.0" y="190.0" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="bold">36</text><text x="650.0" y="206.0" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal">teeth passed</text><text x="20.0" y="244.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">Both marks are back after LCM(12, 18) = 36 teeth: A turns 36 ÷ 12 = 3 times, B turns 2 times.</text></svg>
