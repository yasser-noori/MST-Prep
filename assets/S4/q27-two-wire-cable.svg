<svg xmlns="http://www.w3.org/2000/svg" width="612" height="202" viewBox="0 0 612 202" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Two-wire cable and clip lead</title><desc>The near contacts U and V are separate. The upper wire leads from U to Map and the lower wire from V to Desk as labelled. The lamps share a return to negative. The positive clip is unattached.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="611" height="201" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Two-wire cable and clip lead</text><rect x="153.0" y="43.0" width="222.0" height="111.0" rx="6" fill="#ddeaff" stroke="#57606a" stroke-width="1.1"/><text x="264.0" y="63.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Two separate wires</text><circle cx="116.0" cy="88.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="98.0" y="93.0" font-size="14" fill="#1f2328" text-anchor="end" font-weight="bold">U</text><line x1="120.0" y1="88.0" x2="423.0" y2="88.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="436.0" cy="88.0" r="13.0" fill="#fff" stroke="#1f2328" stroke-width="2"/><line x1="431.0" y1="83.0" x2="441.0" y2="93.0" stroke="#1f2328" stroke-width="1.6"/><line x1="431.0" y1="93.0" x2="441.0" y2="83.0" stroke="#1f2328" stroke-width="1.6"/><text x="436.0" y="69.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Map</text><line x1="449.0" y1="88.0" x2="529.0" y2="88.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="375.0" cy="88.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><circle cx="116.0" cy="131.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="98.0" y="136.0" font-size="14" fill="#1f2328" tex