<svg xmlns="http://www.w3.org/2000/svg" width="548" height="225" viewBox="0 0 548 225" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Use the lit bulb as evidence</title><desc>K is lit on the lower branch, so its switch B and the common switch C are closed. J is dark on the upper branch; its switch A is open in this illustrated circuit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="547" height="224" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Use the lit bulb as evidence</text><circle cx="31.0" cy="81.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="86.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><circle cx="517.0" cy="81.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="517.0" y="86.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><line x1="170.0" y1="81.0" x2="170.0" y2="152.0" stroke="#1f2328" stroke-width="2.6"/><line x1="170.0" y1="81.0" x2="170.0" y2="152.0" stroke="#1f6feb" stroke-width="2.6"/><line x1="467.0" y1="81.0" x2="467.0" y2="152.0" stroke="#1f2328" stroke-width="2.6"/><line x1="467.0" y1="81.0" x2="467.0" y2="152.0" stroke="#1f6feb" stroke-width="2.6"/><line x1="43.0" y1="81.0" x2="92.0" y2="81.0" stroke="#1f6feb" stroke-width="2.6"/><line x1="92.0" y1="81.0" x2="124.0" y2="81.0" stroke="#1f6feb" stroke-width="2.6"/><circle cx="92.0" cy="81.0" r="3.5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/><circle cx="124.0" cy="81.0" r="3.5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/><text x="108.0" y="104.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">C closed</text><line x1="124.0" y1="81.0" x2="170