<svg xmlns="http://www.w3.org/2000/svg" width="583" height="210" viewBox="0 0 583 210" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Test a sample with one gap</title><desc>First, bridge both contacts with known metal and check that the bulb lights. Next place the unknown sample across the same contacts and observe the bulb again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="582" height="209" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Test a sample with one gap</text><circle cx="31.0" cy="74.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="79.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><circle cx="552.0" cy="74.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="552.0" y="79.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><line x1="43.0" y1="74.0" x2="200.0" y2="74.0" stroke="#1f6feb" stroke-width="2.6"/><circle cx="213.0" cy="74.0" r="13.0" fill="#ffe6d2" stroke="#1f6feb" stroke-width="2"/><line x1="208.0" y1="69.0" x2="218.0" y2="79.0" stroke="#1f6feb" stroke-width="1.6"/><line x1="208.0" y1="79.0" x2="218.0" y2="69.0" stroke="#1f6feb" stroke-width="1.6"/><text x="213.0" y="55.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Bulb lit</text><line x1="226.0" y1="74.0" x2="366.0" y2="74.0" stroke="#1f6feb" stroke-width="2.6"/><rect x="366.0" y="68.0" width="38.0" height="12.0" rx="2" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><circle cx="366.0" cy="74.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><circle cx="404.0" cy="74.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="385.0" y="55.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Known metal</text><line x1="404.0" y1="74.0" x2="540.0" y2="74.0" stroke="#1f6feb" stroke-width="2.6"/><text x="24.0" y="106.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">1. Check the tester with a known conductor.</text><circle cx="31.0" cy="151.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="156.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><circle cx="552.0" cy="151.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="552.0" y="156.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><line x1="43.0" y1="151.0" x2="200.0" y2="151.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="213.0" cy="151.0" r="13.0" fill="#fff" stroke="#1f2328" stroke-width="2"/><line x1="208.0" y1="146.0" x2="218.0" y2="156.0" stroke="#1f2328" stroke-width="1.6"/><line x1="208.0" y1="156.0" x2="218.0" y2="146.0" stroke="#1f2328" stroke-width="1.6"/><text x="213.0" y="132.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Observe bulb</text><line x1="226.0" y1="151.0" x2="366.0" y2="151.0" stroke="#1f2328" stroke-width="2.6"/><rect x="366.0" y="145.0" width="38.0" height="12.0" rx="2" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><circle cx="366.0" cy="151.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><circle cx="404.0" cy="151.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="385.0" y="132.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Unknown sample</text><line x1="404.0" y1="151.0" x2="540.0" y2="151.0" stroke="#1f2328" stroke-width="2.6"/><text x="24.0" y="184.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">2. Replace the metal with the sample. Keep the rest of the loop the same.</text></svg>
