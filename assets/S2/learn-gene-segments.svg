<svg xmlns="http://www.w3.org/2000/svg" width="584" height="186" viewBox="0 0 584 186" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Two stretches on chromosome 3</title><desc>Chromosome 3 inside a nucleus. The enlarged DNA strand marks two distinct segments: K1: fur colour and K2: claw length.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="583" height="185" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Two stretches on chromosome 3</text><circle cx="89.0" cy="112.0" r="56.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><line x1="55.0" y1="110.0" x2="105.0" y2="110.0" stroke="#d4600f" stroke-width="3"/><text x="118.0" y="115.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">3</text><text x="89.0" y="178.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Nucleus</text><line x1="154.0" y1="110.0" x2="206.0" y2="110.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180.0" y="99.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Zoom</text><line x1="225.0" y1="110.0" x2="554.0" y2="110.0" stroke="#1f2328" stroke-width="2"/><rect x="246.0" y="100.0" width="85.0" height="20.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><line x1="288.5" y1="120.0" x2="288.5" y2="136.0" stroke="#57606a" stroke-width="1.5"/><text x="288.5" y="153.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">K1: fur colour</text><rect x="411.0" y="100.0" width="85.0" height="20.0" rx="5" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><line x1="453.5" y1="120.0" x2="453.5" y2="136.0" stroke="#57606a" stroke-width="1.5"/><text x="453.5" y="153.0" font-size="14" fi