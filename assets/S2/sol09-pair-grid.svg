<svg xmlns="http://www.w3.org/2000/svg" width="400" height="206" viewBox="0 0 400 206" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Four equally likely pairs</title><desc>A Bb parent contributes B or b. The four pairs are BB, Bb, bB and bb. Only bb gives brown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="399" height="205" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Four equally likely pairs</text><text x="191.0" y="59.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">B</text><text x="309.0" y="59.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">b</text><text x="98.0" y="98.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">B</text><rect x="140.0" y="73.0" width="102.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="191.0" y="97.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">BB</text><rect x="258.0" y="73.0" width="102.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="309.0" y="97.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Bb</text><text x="98.0" y="144.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">b</text><rect x="140.0" y="119.0" width="102.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="191.0" y="143.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">bB</text><rect x="258.0" y="119.0" width="102.0" height="38.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="309.0" y="143.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">bb</text><text x="24.0" y="184.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">One brown outcome out of four equally likely pairs.</text></svg>
