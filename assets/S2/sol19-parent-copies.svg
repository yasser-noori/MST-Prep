<svg xmlns="http://www.w3.org/2000/svg" width="626" height="223" viewBox="0 0 626 223" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Work backward from both flower colours</title><desc>A red RR offspring needs R from parent 1 and parent 2. A white WW offspring needs W from both. Each parent must have RW, which gives pink flowers under the stated rule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="625" height="222" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Work backward from both flower colours</text><rect x="158.0" y="48.0" width="134.0" height="37.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="225.0" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Parent 1</text><rect x="318.0" y="48.0" width="134.0" height="37.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="385.0" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Parent 2</text><text x="25.0" y="117.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">Red offspring (RR)</text><rect x="179.0" y="101.0" width="92.0" height="25.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="225.0" y="118.0" font-size="15" fill="#d4600f" text-anchor="middle" font-weight="bold">R</text><rect x="339.0" y="101.0" width="92.0" height="25.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="385.0" y="118.0" font-size="15" fill="#d4600f" text-anchor="middle" font-weight="bold">R</text><text x="25.0" y="155.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">White offspring (WW)</text><rect x="179.0" y="139.0" width="92.0" height="25.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="225.0" y="156.0" font-size="15" fill="#57606a" text-anchor="middle" font-weight="bold">W</text><rect x="339.0" y="139.0" width="92.0" height="25.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="385.0" y="156.0" font-size="15" fill="#57606a" text-anchor="middle" font-weight="bold">W</text><text x="26.0" y="195.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Copies needed</text><text x="225.0" y="196.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">RW</text><text x="385.0" y="196.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">RW</text><text x="468.0" y="195.0" font-size="15" fill="#1a7f37" text-anchor="start" font-weight="bold">RW gives pink.</text></svg>
