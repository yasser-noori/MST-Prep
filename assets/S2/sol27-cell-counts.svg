<svg xmlns="http://www.w3.org/2000/svg" width="620" height="245" viewBox="0 0 620 245" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count cells using the wall</title><desc>Six wall-bearing bean cells have chloroplasts and five wall-bearing bean cells lack them. Nine cells lack the wall. Adding the two wall-bearing groups gives 11 bean cells.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="619" height="244" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Count cells using the wall</text><rect x="24.0" y="51.0" width="183.0" height="124.0" rx="8" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="115.0" y="76.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Wall and chloroplasts</text><rect x="45.0" y="97.0" width="18.0" height="14.0" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><circle cx="54.0" cy="104.0" r="4.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.4"/><line x1="52.0" y1="104.0" x2="56.0" y2="104.0" stroke="#1a7f37" stroke-width="1.2"/><rect x="75.0" y="97.0" width="18.0" height="14.0" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><circle cx="84.0" cy="104.0" r="4.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.4"/><line x1="82.0" y1="104.0" x2="86.0" y2="104.0" stroke="#1a7f37" stroke-width="1.2"/><rect x="105.0" y="97.0" width="18.0" height="14.0" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><circle cx="114.0" cy="104.0" r="4.0" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.4"/><line x1="112.0" y1="104.0" x2="116.0" y2="104.0" stroke="#1a7f37" stroke-width="1.2"/><rect x="135.0" y="97.0" width="18.0" height="14.0" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><circl