<svg xmlns="http://www.w3.org/2000/svg" width="520" height="212" viewBox="0 0 520 212" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Put brackets around the negative input</title><desc>Replacing both x values with negative 3 gives 2 times negative 3 squared minus negative 3 plus 1 in brackets. The square is 9, and the second bracket is negative 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="211" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Put brackets around the negative input</text><text x="260.0" y="66.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">2x² − (x + 1)  with  x = −3</text><rect x="42.0" y="84.0" width="202.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="143.0" y="107.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">2 × (−3)²</text><text x="260.0" y="107.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><rect x="277.0" y="84.0" width="201.0" height="36.0" rx="5" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="377.5" y="107.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">(−3 + 1)</text><text x="143.0" y="147.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">(−3) × (−3) = 9</text><text x="378.0" y="147.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">Inside brackets: −2</text><text x="260.0" y="191.0" font-size="18" fill="#1a7f37" text-anchor="middle" font-weight="bold">2 × 9 − (−2) = 20</text></svg>
