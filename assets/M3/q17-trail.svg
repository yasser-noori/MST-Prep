<svg xmlns="http://www.w3.org/2000/svg" width="520" height="178" viewBox="0 0 520 178" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Two walkers on the same trail</title><desc>Isha walks from marker A at kilometre 6 toward Leo at 4 km/h. Leo walks from marker B at kilometre 39 toward Isha at 7 km/h.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="177" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Two walkers on the same trail</text><line x1="65.0" y1="109.0" x2="455.0" y2="109.0" stroke="#1f2328" stroke-width="2"/><circle cx="65.0" cy="109.0" r="5.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><text x="65.0" y="137.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">A · km 6</text><circle cx="455.0" cy="109.0" r="5.0" fill="#1f2328" stroke="none" stroke-width="1.5"/><text x="455.0" y="137.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">B · km 39</text><line x1="69.0" y1="88.0" x2="208.0" y2="88.0" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow)"/><line x1="451.0" y1="88.0" x2="310.0" y2="88.0" stroke="#d4600f" stroke-width="2" marker-end="url(#arrow)"/><text x="135.0" y="73.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Isha · 4 km/h</text><text x="385.0" y="73.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Leo · 7 km/h</text></svg>
