<svg xmlns="http://www.w3.org/2000/svg" width="520" height="205" viewBox="0 0 520 205" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare the changes between two columns</title><desc>From input 1 to input 4 is a change of 3. From output 8 to output 20 is a change of 12. The output increases by 4 per input unit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="204" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Compare the changes between two columns</text><text x="30.0" y="88.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Input</text><rect x="129.0" y="65.0" width="75.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="166.5" y="88.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text><rect x="389.0" y="65.0" width="75.0" height="36.0" rx="5" fill="#ddeaff" stroke="#1f2328" stroke-width="1.5"/><text x="426.5" y="88.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><line x1="217.0" y1="83.0" x2="376.0" y2="83.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="270.0" y="69.0" width="52.0" height="27.0" rx="0" fill="white" stroke="none" stroke-width="1.5"/><text x="296.0" y="88.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">+3</text><text x="30.0" y="139.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Output</text><rect x="129.0" y="116.0" width="75.0" height="36.0" rx="5" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="166.5" y="139.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">8</text><rect x="389.0" y="116.0" width="75.0" height="36.0" rx="5" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="426.5" y="139.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">20</text><line x1="217.0" y1="134.0" x2="376.0" y2="134.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="270.0" y="120.0" width="52.0" height="27.0" rx="0" fill="white" stroke="none" stroke-width="1.5"/><text x="296.0" y="139.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">+12</text><text x="260.0" y="181.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">12 ÷ 3 = 4 output units per input unit</text></svg>
