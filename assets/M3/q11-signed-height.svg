<svg xmlns="http://www.w3.org/2000/svg" width="520" height="239" viewBox="0 0 520 239" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The ledge marks zero height</title><desc>A climber starts at negative 6 metres relative to the ledge. Upward is positive and the climber rises at 2 metres per minute.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="238" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">The ledge marks zero height</text><line x1="104.0" y1="68.0" x2="104.0" y2="192.0" stroke="#57606a" stroke-width="2"/><line x1="104.0" y1="73.0" x2="104.0" y2="49.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="83.0" y1="87.0" x2="260.0" y2="87.0" stroke="#1f2328" stroke-width="3"/><text x="280.0" y="93.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Ledge · 0 m</text><line x1="104.0" y1="181.0" x2="269.0" y2="181.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="104.0" cy="181.0" r="5.0" fill="#1f6feb" stroke="none" stroke-width="1.5"/><text x="280.0" y="187.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Start · −6 m</text><line x1="194.0" y1="165.0" x2="194.0" y2="108.0" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow)"/><text x="213.0" y="142.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Rises 2 m per minute</text><text x="122.0" y="60.0" font-size="15" fill="#57606a" text-anchor="start" font-weight="normal">Positive direction</text></svg>
