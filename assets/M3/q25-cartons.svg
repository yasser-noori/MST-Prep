<svg xmlns="http://www.w3.org/2000/svg" width="520" height="203" viewBox="0 0 520 203" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Beads in the two cartons</title><desc>The cartons have the same unknown number of red beads. Carton 1 adds 6 blue beads, and carton 2 adds 10 blue beads.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Beads in the two cartons</text><text x="140.0" y="66.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Carton 1</text><rect x="30.0" y="80.0" width="220.0" height="93.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><rect x="43.0" y="92.0" width="194.0" height="32.0" rx="5" fill="white" stroke="#cf222e" stroke-width="1.5"/><text x="140.0" y="113.0" font-size="16" fill="#cf222e" text-anchor="middle" font-weight="bold">Same red count</text><text x="140.0" y="151.0" font-size="16" fill="#1f6feb" text-anchor="middle" font-weight="bold">6 blue beads</text><text x="377.0" y="66.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Carton 2</text><rect x="267.0" y="80.0" width="220.0" height="93.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><rect x="280.0" y="92.0" width="194.0" height="32.0" rx="5" fill="white" stroke="#cf222e" stroke-width="1.5"/><text x="377.0" y="113.0" font-size="16" fill="#cf222e" text-anchor="middle" font-weight="bold">Same red count</text><text x="377.0" y="151.0" font-size="16" fill="#1f6feb" text-anchor="middle" font-weight="bold">10 blue beads</text></svg>
