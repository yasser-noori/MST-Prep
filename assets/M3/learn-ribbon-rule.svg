<svg xmlns="http://www.w3.org/2000/svg" width="520" height="207" viewBox="0 0 520 207" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Start with 18 m, then subtract per parcel</title><desc>A tape shows 18 metres at the start. The first parcel uses 2 metres and leaves 16 metres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="206" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Start with 18 m, then subtract per parcel</text><text x="24.0" y="83.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Before wrapping</text><rect x="166.0" y="62.0" width="324.0" height="32.0" rx="5" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="328.0" y="83.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">18 m to start</text><text x="24.0" y="131.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">After 1 parcel</text><rect x="166.0" y="110.0" width="324.0" height="32.0" rx="5" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="454.0" y="110.0" width="36.0" height="32.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="472.0" y="131.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">2 m</text><text x="310.0" y="131.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">16 m left</text><text x="260.0" y="181.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">After p parcels: 18 − 2p metres left</text></svg>
