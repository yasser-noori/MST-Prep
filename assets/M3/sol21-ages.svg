<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Line up their current ages</title><desc>Their current ages total 28 years. Arun has Beth&#x27;s age plus 4 years. After removing the 4 extra years, the two equal portions total 24 years. Beth is 12.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="239" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Line up their current ages</text><text x="42.0" y="99.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Beth</text><rect x="111.0" y="75.0" width="210.0" height="39.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="216.0" y="100.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Beth’s age</text><text x="42.0" y="150.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Arun</text><rect x="111.0" y="126.0" width="210.0" height="39.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="216.0" y="151.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Beth’s age</text><rect x="321.0" y="126.0" width="70.0" height="39.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="356.0" y="151.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">4 years</text><text x="260.0" y="193.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">Ages now total 34 − 6 = 28 years</text><text x="260.0" y="220.0" font-size="17" fill="#1a7f37" text-anchor="middle" font-weight="bold">Beth’s age = (28 − 4) ÷ 2 = 12</text></svg>
