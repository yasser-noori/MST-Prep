<svg xmlns="http://www.w3.org/2000/svg" width="520" height="151" viewBox="0 0 520 151" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Rebuild the starting pile</title><desc>Add the 36 bookmarks handed out to the 58 left, giving 94 at the start.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Rebuild the starting pile</text><rect x="35.0" y="56.0" width="277.7" height="38.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><rect x="312.7" y="56.0" width="172.3" height="38.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="173.8" y="80.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">58 left</text><text x="398.8" y="80.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">4 × 9 = 36 given away</text><text x="260.0" y="122.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="bold">Starting pile = 58 + 36 = 94</text></svg>
