<svg xmlns="http://www.w3.org/2000/svg" width="566" height="219" viewBox="0 0 566 219" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Order in which the thermometer visits the cups</title><desc>The thermometer starts in 8-degree water, moves to 32-degree water and then moves to 18-degree water.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="565" height="218" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Order in which the thermometer visits the cups</text><rect x="79.0" y="103.0" width="78.0" height="56.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M79,87 V159 H157 V87" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="79.0" y1="103.0" x2="157.0" y2="103.0" stroke="#1f6feb" stroke-width="2"/><text x="118.0" y="138.0" font-size="18" fill="#1f6feb" text-anchor="middle" font-weight="bold">8 °C</text><text x="118.0" y="184.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Starts here</text><rect x="244.0" y="103.0" width="78.0" height="56.0" rx="0" fill="#ffe6d2" stroke="none" stroke-width="1.5"/><path d="M244,87 V159 H322 V87" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="244.0" y1="103.0" x2="322.0" y2="103.0" stroke="#d4600f" stroke-width="2"/><text x="283.0" y="138.0" font-size="18" fill="#d4600f" text-anchor="middle" font-weight="bold">32 °C</text><text x="283.0" y="184.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">First move</text><rect x="409.0" y="103.0" width="78.0" height="56.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M409,87 V159 H487 V87" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="409.0" y1="103.0" x2="487.0" y2="103.0" stroke="#1f6feb" stroke-width="2"/><text x="448.0" y="138.0" font-size="18" fill="#1f6feb" text-anchor="middle" font-weight="bold">18 °C</text><text x="448.0" y="184.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Second move</text><line x1="166.0" y1="125.0" x2="235.0" y2="125.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="331.0" y1="125.0" x2="400.0" y2="125.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><text x="283.0" y="207.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Arrows show where the thermometer moves.</text></svg>
