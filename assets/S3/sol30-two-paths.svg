<svg xmlns="http://www.w3.org/2000/svg" width="562" height="255" viewBox="0 0 562 255" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Different paths fit the same two readings</title><desc>Both example paths start at 19 degrees Celsius at minute 2 and end at 25 degrees at minute 6. One example is cooler than the other at minute 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="561" height="254" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Different paths fit the same two readings</text><path d="M72,58 V188 H513" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/><text x="25.0" y="66.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">°C</text><line x1="285.0" y1="60.0" x2="285.0" y2="188.0" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4 4"/><text x="59.0" y="156.0" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">19</text><line x1="69.0" y1="151.0" x2="76.0" y2="151.0" stroke="#1f2328" stroke-width="1.5"/><text x="59.0" y="89.0" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">25</text><line x1="69.0" y1="84.0" x2="76.0" y2="84.0" stroke="#1f2328" stroke-width="1.5"/><line x1="110.0" y1="151.0" x2="460.0" y2="84.0" stroke="#1f6feb" stroke-width="2.5"/><line x1="110.0" y1="151.0" x2="285.0" y2="151.0" stroke="#d4600f" stroke-width="2.5" stroke-dasharray="6 3"/><line x1="285.0" y1="151.0" x2="460.0" y2="84.0" stroke="#d4600f" stroke-width="2.5" stroke-dasharray="6 3"/><circle cx="110.0" cy="151.0" r="5.5" fill="#1f2328" stroke="white" stroke-width="1.5"/><circle cx="460.0" cy="84.0" r="5.5" fill="#1f2328" stroke="white" stroke-width="1.5"/><text x="110.0" y="209.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">2</text><text x="285.0" y="209.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">4</text><text x="460.0" y="209.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">6</text><text x="286.0" y="233.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Time (minutes)</text><text x="363.0" y="165.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Two possible paths</text></svg>
