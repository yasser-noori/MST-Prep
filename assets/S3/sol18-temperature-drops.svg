<svg xmlns="http://www.w3.org/2000/svg" width="530" height="236" viewBox="0 0 530 236" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Compare each two-minute drop</title><desc>Drops are 6, 12, 8, 5 and 3 degrees Celsius. The largest drop, 12 degrees Celsius, occurs from 2 to 4 minutes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="529" height="235" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Compare each two-minute drop</text><text x="26.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">0–2 min</text><rect x="119.0" y="52.0" width="150.0" height="22.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="280.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">6 °C</text><text x="26.0" y="101.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">2–4 min</text><rect x="119.0" y="85.0" width="300.0" height="22.0" rx="4" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="430.0" y="101.0" font-size="14" fill="#1a7f37" text-anchor="start" font-weight="bold">12 °C</text><text x="26.0" y="134.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">4–6 min</text><rect x="119.0" y="118.0" width="200.0" height="22.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="330.0" y="134.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">8 °C</text><text x="26.0" y="167.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">6–8 min</text><rect x="119.0" y="151.0" width="125.0" height="22.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="255.0" y="167.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">5 °C</text><text x="26.0" y="200.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">8–10 min</text><rect x="119.0" y="184.0" width="75.0" height="22.0" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="205.0" y="200.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">3 °C</text></svg>
