<svg xmlns="http://www.w3.org/2000/svg" width="544" height="258" viewBox="0 0 544 258" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Measure only the rise</title><desc>Water reads 35 mL before and 50 mL with the cube submerged. The 15 mL rise is a volume of 15 cubic centimetres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="543" height="257" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Measure only the rise</text><rect x="142.0" y="124.8" width="64.0" height="61.2" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M142,71 V186 H206 V71" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="198.0" y1="168.5" x2="206.0" y2="168.5" stroke="#57606a" stroke-width="1"/><line x1="198.0" y1="151.0" x2="206.0" y2="151.0" stroke="#57606a" stroke-width="1"/><line x1="198.0" y1="133.5" x2="206.0" y2="133.5" stroke="#57606a" stroke-width="1"/><line x1="198.0" y1="116.0" x2="206.0" y2="116.0" stroke="#57606a" stroke-width="1"/><line x1="198.0" y1="98.5" x2="206.0" y2="98.5" stroke="#57606a" stroke-width="1"/><line x1="198.0" y1="81.0" x2="206.0" y2="81.0" stroke="#57606a" stroke-width="1"/><line x1="142.0" y1="124.8" x2="206.0" y2="124.8" stroke="#1f6feb" stroke-width="2"/><text x="132.0" y="129.8" font-size="14" fill="#1f6feb" text-anchor="end" font-weight="normal">35 mL</text><rect x="344.0" y="98.5" width="64.0" height="87.5" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M344,71 V186 H408 V71" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="400.0" y1="168.5" x2="408.0" y2="168.5" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="151.0" x2="408.0" y2="151.0" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="133.5" x2="408.0" y2="133.5" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="116.0" x2="408.0" y2="116.0" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="98.5" x2="408.0" y2="98.5" stroke="#57606a" stroke-width="1"/><line x1="400.0" y1="81.0" x2="408.0" y2="81.0" stroke="#57606a" stroke-width="1"/><line x1="344.0" y1="98.5" x2="408.0" y2="98.5" stroke="#1f6feb" stroke-width="2"/><text x="334.0" y="103.5" font-size="14" fill="#1f6feb" text-anchor="end" font-weight="normal">50 mL</text><path d="M365,147 l6.72,-6.72 h21 l-6.72,6.72 Z" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><path d="M386,147 l6.72,-6.72 v21 l-6.72,6.72 Z" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5" stroke-linejoin="round"/><rect x="365.0" y="147.0" width="21.0" height="21.0" rx="0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><line x1="208.0" y1="124.8" x2="413.0" y2="124.8" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="414.0" y1="98.5" x2="449.0" y2="98.5" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M449,98.5 h8 V124.75 h-8" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/><text x="468.0" y="116.6" font-size="14" fill="#1a7f37" text-anchor="start" font-weight="bold">15 mL</text><text x="174.0" y="213.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Water alone</text><text x="376.0" y="213.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Same water and cube</text><text x="272.0" y="239.0" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="normal">50 mL − 35 mL = 15 mL, so the cube occupies 15 cm³.</text></svg>
