<svg xmlns="http://www.w3.org/2000/svg" width="560" height="204" viewBox="0 0 560 204" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Temperature, temperature change and heat flow</title><desc>Sample A cools from 47 to 32 degrees Celsius, a 15 degree drop. At contact, energy flows from the warmer 47-degree object to the cooler 32-degree object.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="203" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Temperature, temperature change and heat flow</text><text x="26.0" y="59.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">One sample, two times</text><text x="265.0" y="93.0" font-size="19" fill="#1f6feb" text-anchor="middle" font-weight="bold">47 °C  →  32 °C</text><text x="519.0" y="93.0" font-size="15" fill="#57606a" text-anchor="end" font-weight="normal">Drop 15 °C</text><line x1="26.0" y1="117.0" x2="534.0" y2="117.0" stroke="#d0d7de" stroke-width="1.5"/><text x="26.0" y="144.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Two touching objects, same instant</text><text x="147.0" y="178.0" font-size="16" fill="#d4600f" text-anchor="middle" font-weight="normal">Warmer 47 °C</text><line x1="218.0" y1="174.0" x2="340.0" y2="174.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><text x="413.0" y="178.0" font-size="16" fill="#1f6feb" text-anchor="middle" font-weight="normal">Cooler 32 °C</text></svg>
