<svg xmlns="http://www.w3.org/2000/svg" width="576" height="147" viewBox="0 0 576 147" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Filter the rows by what each light shows</title><desc>A dark dot keeps only rows 3 and 4 because Y matches Z. A lit square then keeps only row 3 because X differs from Y.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="575" height="146" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Filter the rows by what each light shows</text><text x="24.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Possible inputs</text><rect x="24.0" y="81.0" width="138.0" height="36.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="93.0" y="104.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Rows 1, 2, 3, 4, 5</text><text x="218.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Dark dot: Y = Z</text><rect x="218.0" y="81.0" width="138.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="287.0" y="104.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Rows 3 and 4</text><text x="412.0" y="68.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Lit square: X ≠ Y</text><rect x="412.0" y="81.0" width="138.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="481.0" y="104.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Row 3</text><line x1="174.0" y1="99.0" x2="205.0" y2="99.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="368.0" y1="99.0" x2="399.0" y2="99.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/></svg>
