<svg xmlns="http://www.w3.org/2000/svg" width="620" height="106" viewBox="0 0 620 106" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Apply both rules to the same setting</title><desc>Star on means R off, leaving settings 1, 4 and 5. P and Q match only in setting 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="619" height="105" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Apply both rules to the same setting</text><rect x="18.0" y="48.0" width="172.7" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="104.3" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">All five settings</text><line x1="192.7" y1="67.0" x2="209.7" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="212.7" y="48.0" width="172.7" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="299.0" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">R OFF: 1, 4, 5</text><line x1="387.3" y1="67.0" x2="404.3" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="407.3" y="48.0" width="172.7" height="38.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="493.7" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">P = Q: setting 4</text></svg>
