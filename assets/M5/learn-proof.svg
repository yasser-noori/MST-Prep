<svg xmlns="http://www.w3.org/2000/svg" width="606" height="184" viewBox="0 0 606 184" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Match your check to the question</title><desc>Could: find one valid arrangement. Must: check whether any valid arrangement breaks the claim. Enough information: check whether every valid arrangement gives the same answer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="605" height="183" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Match your check to the question</text><rect x="24.0" y="48.0" width="164.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="106.0" y="71.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Could</text><text x="205.0" y="72.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Find one arrangement that works.</text><rect x="24.0" y="91.0" width="164.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="106.0" y="114.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Must</text><text x="205.0" y="115.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Try to find an arrangement that breaks the claim.</text><rect x="24.0" y="134.0" width="164.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="106.0" y="157.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Enough information?</text><text x="205.0" y="158.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Compare the answer across all valid arrangements.</text></svg>
