<svg xmlns="http://www.w3.org/2000/svg" width="500" height="177" viewBox="0 0 500 177" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One-way shuttle links</title><desc>Hub leads to North and South. North leads to Hall. South leads to Park, which leads to Hall.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="499" height="176" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">One-way shuttle links</text><line x1="103.0" y1="100.0" x2="146.0" y2="70.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="103.0" y1="107.0" x2="146.0" y2="132.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="239.0" y1="68.0" x2="391.0" y2="99.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="239.0" y1="132.0" x2="269.0" y2="132.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="361.0" y1="132.0" x2="391.0" y2="112.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="23.0" y="84.0" width="86.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="66.0" y="108.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Hub</text><rect x="150.0" y="49.0" width="86.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="193.0" y="73.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">North</text><rect x="150.0" y="114.0" width="86.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="193.0" y="138.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">South</text><rect x="273.0" y="114.0" width="86.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d