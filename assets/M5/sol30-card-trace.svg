<svg xmlns="http://www.w3.org/2000/svg" width="610" height="177" viewBox="0 0 610 177" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Skip the card, including its instruction</title><desc>READ 4 adds four. The first SKIP steps over the second SKIP. READ 2 and READ 1 then run, bringing the total from four to six to seven.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="609" height="176" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Skip the card, including its instruction</text><rect x="116.0" y="86.0" width="89.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="160.5" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">READ 4</text><text x="160.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text><rect x="210.0" y="86.0" width="89.0" height="36.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="254.5" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">SKIP</text><text x="254.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text><rect x="304.0" y="86.0" width="89.0" height="36.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="348.5" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">SKIP</text><text x="348.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Skipped</text><rect x="398.0" y="86.0" width="89.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="442.5" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">READ 2</text><text x="442.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">6</text><rect x="492.0" y="86.0" width="89.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="536.5" y="109.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">READ 1</text><text x="536.0" y="148.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">7</text><path d="M255,81 V63 H443 V79" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/><line x1="443.0" y1="69.0" x2="443.0" y2="80.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="349.0" y="57.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Skip one card</text><text x="25.0" y="148.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Total</text></svg>
