<svg xmlns="http://www.w3.org/2000/svg" width="580" height="289" viewBox="0 0 580 289" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count the overlap once</title><desc>Of nine metal objects, six are metal only and three are in both groups. Of seven objects from the 1800s, four are from the 1800s only. The total is 6 + 3 + 4 = 13.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="579" height="288" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Count the overlap once</text><text x="208.0" y="62.0" font-size="15" fill="#1f6feb" text-anchor="middle" font-weight="bold">Metal · 9 total</text><text x="372.0" y="62.0" font-size="15" fill="#d4600f" text-anchor="middle" font-weight="bold">From the 1800s · 7 total</text><circle cx="235.0" cy="154.0" r="87.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><circle cx="345.0" cy="154.0" r="87.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><path d="M290,86.6 A87,87 0 0 1 290,221.4 A87,87 0 0 1 290,86.6 Z" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.3" stroke-linejoin="round"/><text x="209.0" y="153.0" font-size="28" fill="#1f2328" text-anchor="middle" font-weight="bold">6</text><text x="209.0" y="178.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Metal only</text><text x="290.0" y="153.0" font-size="28" fill="#1f2328" text-anchor="middle" font-weight="bold">3</text><text x="290.0" y="178.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Both</text><text x="369.0" y="153.0" font-size="28" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><text x="369.0" y="178.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">1800s only</text><text x="290.0" y="268.0" font-size="17" fill="#1a7f37" text-anchor="middle" font-weight="bold">6 + 3 + 4 = 13 distinct objects</text></svg>
