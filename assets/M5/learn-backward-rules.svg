<svg xmlns="http://www.w3.org/2000/svg" width="542" height="184" viewBox="0 0 542 184" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Start with the observed light</title><desc>If the light comes on when inputs match, work backward to two possibilities: both ON or both OFF. Another clue is needed to distinguish them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="541" height="183" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Start with the observed light</text><rect x="26.0" y="91.0" width="167.0" height="36.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="109.5" y="114.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Matching light is on</text><rect x="302.0" y="56.0" width="210.0" height="36.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="407.0" y="79.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">ON and ON</text><rect x="302.0" y="126.0" width="210.0" height="36.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="407.0" y="149.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">OFF and OFF</text><line x1="205.0" y1="109.0" x2="289.0" y2="74.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="205.0" y1="109.0" x2="289.0" y2="144.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/></svg>
