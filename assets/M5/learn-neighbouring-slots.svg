<svg xmlns="http://www.w3.org/2000/svg" width="568" height="211" viewBox="0 0 568 211" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Draw extra space when the clue allows it</title><desc>Bea immediately before Kai means neighbouring positions; Bea before Kai allows either neighbouring positions or an intervening position.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="567" height="210" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Draw extra space when the clue allows it</text><text x="24.0" y="68.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Immediately before</text><text x="24.0" y="155.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Before</text><rect x="200.0" y="50.0" width="103.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="251.5" y="73.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Bea</text><rect x="308.0" y="50.0" width="103.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="359.5" y="73.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Kai</text><rect x="200.0" y="137.0" width="103.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="251.5" y="160.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Bea</text><rect x="308.0" y="137.0" width="103.0" height="36.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="359.5" y="160.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">…</text><rect x="416.0" y="137.0" width="103.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="467.5" y="160.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Kai</text><text x="200.0" y="108.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">The two places touch.</text><text x="200.0" y="195.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">Other places may lie between them.</text></svg>
