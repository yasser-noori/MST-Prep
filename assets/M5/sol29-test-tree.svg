<svg xmlns="http://www.w3.org/2000/svg" width="635" height="252" viewBox="0 0 635 252" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Use the second test only after gold</title><desc>Start with the lamp test. Blue identifies L, and pink identifies M. For gold, use the drop test: fast identifies J and slow identifies K.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="634" height="251" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Use the second test only after gold</text><rect x="24.0" y="109.0" width="115.0" height="36.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="81.5" y="132.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Lamp test</text><rect x="277.0" y="52.0" width="137.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="345.5" y="75.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Fabric L</text><rect x="277.0" y="109.0" width="137.0" height="36.0" rx="6" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><text x="345.5" y="132.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Drop test</text><rect x="277.0" y="166.0" width="137.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="345.5" y="189.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Fabric M</text><line x1="148.0" y1="127.0" x2="266.0" y2="70.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198.0" y="79.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Blue</text><line x1="148.0" y1="127.0" x2="266.0" y2="127.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="222.0" y="117.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Gold</text><line x1="148.0" y1="127.0" x2="266.0" y2="184.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198.0" y="172.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Pink</text><rect x="522.0" y="79.0" width="88.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="566.0" y="102.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Fabric J</text><line x1="422.0" y1="127.0" x2="511.0" y2="97.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="461.0" y="90.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Fast</text><rect x="522.0" y="139.0" width="88.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><text x="566.0" y="162.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Fabric K</text><line x1="422.0" y1="127.0" x2="511.0" y2="157.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="461.0" y="173.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Slow</text><text x="24.0" y="229.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Worst case: two tests</text></svg>
