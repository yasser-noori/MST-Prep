<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The shelf supplies an upward force while in contact</title><desc>Before the shelf moves, gravity acts down with 12 N and the shelf pushes up with 12 N. Once there is no contact, only the 12 N downward gravity force remains.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="231" rx="12" fill="#ffffff" stroke="#d0d7de"/><line x1="280.0" y1="23.0" x2="280.0" y2="188.0" stroke="#d0d7de" stroke-width="1.5"/><text x="140.0" y="34.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">On the shelf</text><rect x="108.0" y="91.0" width="64.0" height="48.0" rx="4" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><line x1="133.0" y1="91.0" x2="133.0" y2="139.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="61.0" y="139.0" width="158.0" height="11.0" rx="2" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><line x1="140.0" y1="112.0" x2="140.0" y2="66.0" stroke="#1f6feb" stroke-width="2.5"/><path d="M140,56 L145.0,66.0 L135.0,66.0 Z" fill="#1f6feb" stroke="#1f6feb" stroke-width="0.5" stroke-linejoin="round"/><text x="153.0" y="71.0" font-size="14" fill="#1f6feb" text-anchor="start" font-weight="normal">Shelf 12 N</text><line x1="140.0" y1="117.0" x2="140.0" y2="163.0" stroke="#d4600f" stroke-width="2.5"/><path d="M140,173 L135.0,163.0 L145.0,163.0 Z" fill="#d4600f" stroke="#d4600f" stroke-width="0.5" stroke-linejoin="round"/><text x="153.0" y="164.0" font-size="14" fill="#d4600f" text-anchor="start" font-weight="normal">Gravity 12 N</text><text x="420.0" y="34.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">After the shelf slides away</text><rect x="388.0" y="91.0" width="64.0" height="48.0" rx="4" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><line x1="413.0" y1="91.0" x2="413.0" y2="139.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="420.0" y1="117.0" x2="420.0" y2="163.0" stroke="#d4600f" stroke-width="2.5"/><path d="M420,173 L415.0,163.0 L425.0,163.0 Z" fill="#d4600f" stroke="#d4600f" stroke-width="0.5" stroke-linejoin="round"/><text x="433.0" y="164.0" font-size="14" fill="#d4600f" text-anchor="start" font-weight="normal">Gravity 12 N</text><text x="280.0" y="210.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Without contact, the shelf&#x27;s push is gone.</text></svg>
