<svg xmlns="http://www.w3.org/2000/svg" width="560" height="203" viewBox="0 0 560 203" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Combine totals before taking the ratio</title><desc>The float has mass 85 g and volume 100 cubic centimetres, giving 0.85 grams per cubic centimetre; this is below the liquid density of 0.90, so the float rises.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Combine totals before taking the ratio</text><text x="26.0" y="71.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Mass</text><text x="148.0" y="71.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">36 + 49 = 85 g</text><text x="26.0" y="108.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Volume</text><text x="148.0" y="108.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">30 + 70 = 100 cm³</text><line x1="26.0" y1="126.0" x2="535.0" y2="126.0" stroke="#d0d7de" stroke-width="1.5"/><text x="26.0" y="155.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Float density</text><text x="148.0" y="155.0" font-size="16" fill="#1a7f37" text-anchor="start" font-weight="bold">85 ÷ 100 = 0.85 g/cm³</text><text x="148.0" y="181.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">0.85 &lt; 0.90 g/cm³, so the float rises.</text></svg>
