<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Correct both readings by the same amount</title><desc>The display readings 24 and 38 degrees Celsius become 21 and 35 after correction. The change is 14 degrees Celsius in both rows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="189" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Correct both readings by the same amount</text><text x="25.0" y="92.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Display</text><rect x="130.0" y="69.0" width="78.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="169.0" y="93.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">24 °C</text><rect x="334.0" y="69.0" width="78.0" height="36.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="373.0" y="93.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">38 °C</text><line x1="216.0" y1="87.0" x2="325.0" y2="87.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270.0" y="79.0" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="normal">+14 °C</text><text x="25.0" y="149.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Actual</text><rect x="130.0" y="126.0" width="78.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="169.0" y="150.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">21 °C</text><rect x="334.0" y="126.0" width="78.0" height="36.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="373.0" y="150.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">35 °C</text><line x1="216.0" y1="144.0" x2="325.0" y2="144.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270.0" y="136.0" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="normal">+14 °C</text><text x="169.0" y="56.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Before</text><text x="373.0" y="56.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">After</text><text x="435.0" y="148.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">Subtract 3 °C</text></svg>
