<svg xmlns="http://www.w3.org/2000/svg" width="549" height="207" viewBox="0 0 549 207" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A sealed float with two compartments</title><desc>The smaller compartment occupies 30 cubic centimetres and has mass 36 g. The larger one occupies 70 cubic centimetres and has mass 49 g. The liquid density is 0.90 grams per cubic centimetre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="548" height="206" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">A sealed float with two compartments</text><rect x="34.0" y="52.0" width="481.0" height="117.0" rx="9" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.5"/><text x="53.0" y="78.0" font-size="15" fill="#1f6feb" text-anchor="start" font-weight="bold">Liquid density 0.90 g/cm³</text><rect x="69.0" y="95.0" width="123.0" height="54.0" rx="0" fill="#ffe6d2" stroke="#1f2328" stroke-width="1.5"/><text x="130.5" y="117.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">30 cm³</text><text x="130.5" y="139.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">36 g</text><rect x="192.0" y="95.0" width="287.0" height="54.0" rx="0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="335.5" y="117.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">70 cm³</text><text x="335.5" y="139.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">49 g</text><text x="274.0" y="192.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">The two compartment volumes make up the whole outside volume.</text></svg>
