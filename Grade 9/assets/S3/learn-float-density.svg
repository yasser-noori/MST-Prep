<svg xmlns="http://www.w3.org/2000/svg" width="560" height="223" viewBox="0 0 560 223" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Predict the first motion after release</title><desc>For a fully submerged object, density below the liquid gives rising, equal density allows suspension, and density above the liquid gives sinking.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="559" height="222" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Predict the first motion after release</text><rect x="61.0" y="77.0" width="102.0" height="86.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M61,60 V163 H163 V60" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="61.0" y1="77.0" x2="163.0" y2="77.0" stroke="#1f6feb" stroke-width="2"/><circle cx="102.0" cy="120.0" r="13.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><line x1="135.0" y1="120.0" x2="135.0" y2="89.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><text x="112.0" y="184.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Object less dense</text><text x="112.0" y="205.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Rises</text><rect x="229.0" y="77.0" width="102.0" height="86.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M229,60 V163 H331 V60" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="229.0" y1="77.0" x2="331.0" y2="77.0" stroke="#1f6feb" stroke-width="2"/><circle cx="270.0" cy="120.0" r="13.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><line x1="295.0" y1="120.0" x2="311.0" y2="120.0" stroke="#57606a" stroke-width="2"/><text x="280.0" y="184.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Equal densities</text><text x="280.0" y="205.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Stays suspended</text><rect x="397.0" y="77.0" width="102.0" height="86.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M397,60 V163 H499 V60" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="397.0" y1="77.0" x2="499.0" y2="77.0" stroke="#1f6feb" stroke-width="2"/><circle cx="438.0" cy="120.0" r="13.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><line x1="471.0" y1="120.0" x2="471.0" y2="151.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><text x="448.0" y="184.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">Object denser</text><text x="448.0" y="205.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Sinks</text></svg>
