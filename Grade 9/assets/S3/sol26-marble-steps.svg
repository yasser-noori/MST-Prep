<svg xmlns="http://www.w3.org/2000/svg" width="550" height="169" viewBox="0 0 550 169" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Recover the water-only reading in two steps</title><desc>Three extra marbles raise the reading by 15 mL, so one marble displaces 5 mL. Subtracting 5 mL from 41 mL gives 36 mL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="549" height="168" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Recover the water-only reading in two steps</text><rect x="24.0" y="55.0" width="238.0" height="87.0" rx="9" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="37.0" y="84.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">1   Find one marble’s volume</text><text x="37.0" y="114.0" font-size="17" fill="#1f6feb" text-anchor="start" font-weight="bold">(56 − 41) ÷ 3 = 5 mL</text><rect x="288.0" y="55.0" width="238.0" height="87.0" rx="9" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="301.0" y="84.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">2   Remove one marble’s rise</text><text x="301.0" y="114.0" font-size="17" fill="#1a7f37" text-anchor="start" font-weight="bold">41 − 5 = 36 mL</text></svg>
