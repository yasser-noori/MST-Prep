<svg xmlns="http://www.w3.org/2000/svg" width="555" height="206" viewBox="0 0 555 206" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Check the three edge neighbours of X</title><desc>Cells a, b and d share an edge with X. Cell a shares Y’s column, cell b is in the rightmost column, and d also avoids Y’s row.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="554" height="205" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Check the three edge neighbours of X</text><rect x="25.0" y="53.0" width="43.0" height="43.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="46.5" y="79.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">a</text><rect x="72.0" y="53.0" width="43.0" height="43.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="93.5" y="79.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">X</text><rect x="119.0" y="53.0" width="43.0" height="43.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="140.5" y="79.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">b</text><rect x="25.0" y="100.0" width="43.0" height="43.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="46.5" y="126.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">c</text><rect x="72.0" y="100.0" width="43.0" height="43.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="93.5" y="126.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">d</text><rect x="119.0" y="100.0" width="43.0" height="43.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="140.5" y="126.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">e</text><rect x="25.0" y="147.0" width="43.0" height="43.0" rx="6" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="46.5" y="173.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">Y</text><rect x="72.0" y="147.0" width="43.0" height="43.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="93.5" y="173.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">f</text><rect x="119.0" y="147.0" width="43.0" height="43.0" rx="6" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="140.5" y="173.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">g</text><rect x="202.0" y="54.0" width="38.0" height="39.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="221.0" y="78.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">a</text><text x="253.0" y="80.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Shares Y’s column</text><rect x="202.0" y="101.0" width="38.0" height="39.0" rx="6" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="221.0" y="125.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">b</text><text x="253.0" y="127.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">In the rightmost column</text><rect x="202.0" y="148.0" width="38.0" height="39.0" rx="6" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="221.0" y="172.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">d</text><text x="253.0" y="174.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Avoids Y’s row and both columns</text></svg>
