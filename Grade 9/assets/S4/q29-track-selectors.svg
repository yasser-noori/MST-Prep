<svg xmlns="http://www.w3.org/2000/svg" width="657" height="178" viewBox="0 0 657 178" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Both selectors start on the upper track</title><desc>The positive lead feeds the left selector. Both selectors touch the upper track. The right selector returns through the lit lamp to negative. The lower track stays separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="656" height="177" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Both selectors start on the upper track</text><circle cx="31.0" cy="109.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="31.0" y="114.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">+</text><line x1="43.0" y1="109.0" x2="111.0" y2="109.0" stroke="#1f2328" stroke-width="2.6"/><line x1="499.0" y1="109.0" x2="555.0" y2="109.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="568.0" cy="109.0" r="13.0" fill="#ffe6d2" stroke="#1f2328" stroke-width="2"/><line x1="563.0" y1="104.0" x2="573.0" y2="114.0" stroke="#1f2328" stroke-width="1.6"/><line x1="563.0" y1="114.0" x2="573.0" y2="104.0" stroke="#1f2328" stroke-width="1.6"/><text x="568.0" y="90.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Lamp</text><line x1="581.0" y1="109.0" x2="614.0" y2="109.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="626.0" cy="109.0" r="12.0" fill="#f2f4f7" stroke="#1f2328" stroke-width="1.5"/><text x="626.0" y="114.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">−</text><line x1="157.0" y1="81.0" x2="452.0" y2="81.0" stroke="#1f2328" stroke-width="2.6"/><circle cx="157.0" cy="81.0" r="3.5" fill="#fff" stroke="#1f2328" stroke-wid