<svg xmlns="http://www.w3.org/2000/svg" width="498" height="138" viewBox="0 0 498 138" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A DNA ladder with two blanks</title><desc>From left to right, the top strand reads A, Blank 2, C, T and the bottom strand reads Blank 1, G, G, A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="497" height="137" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="19.0" y="47.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Top strand</text><line x1="164.0" y1="41.0" x2="444.0" y2="41.0" stroke="#1f6feb" stroke-width="3"/><text x="19.0" y="100.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Bottom strand</text><line x1="164.0" y1="94.0" x2="444.0" y2="94.0" stroke="#1f6feb" stroke-width="3"/><line x1="190.0" y1="57.0" x2="190.0" y2="78.0" stroke="#57606a" stroke-width="2"/><rect x="165.0" y="24.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="190.0" y="47.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">A</text><rect x="165.0" y="77.0" width="50.0" height="34.0" rx="6" fill="#fff" stroke="#57606a" stroke-width="1.8" stroke-dasharray="4 3"/><text x="190.0" y="100.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Blank 1</text><line x1="266.0" y1="57.0" x2="266.0" y2="78.0" stroke="#57606a" stroke-width="2"/><rect x="241.0" y="24.0" width="50.0" height="34.0" rx="6" fill="#fff" stroke="#57606a" stroke-width="1.8" stroke-dasharray="4 3"/><text x="266.0" y="47.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">Blank 2</text><rect x="241.0" y="77.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="266.0" y="100.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">G</text><line x1="342.0" y1="57.0" x2="342.0" y2="78.0" stroke="#57606a" stroke-width="2"/><rect x="317.0" y="24.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="342.0" y="47.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">C</text><rect x="317.0" y="77.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="342.0" y="100.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">G</text><line x1="418.0" y1="57.0" x2="418.0" y2="78.0" stroke="#57606a" stroke-width="2"/><rect x="393.0" y="24.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="418.0" y="47.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">T</text><rect x="393.0" y="77.0" width="50.0" height="34.0" rx="6" fill="#ddeaff" stroke="#1f6feb" stroke-width="1.8"/><text x="418.0" y="100.0" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="bold">A</text></svg>
