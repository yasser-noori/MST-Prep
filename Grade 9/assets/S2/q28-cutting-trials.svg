<svg xmlns="http://www.w3.org/2000/svg" width="632" height="280" viewBox="0 0 632 280" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Cuttings and soil trials</title><desc>The original supplies cutting 1 for Soil A, which flowers blue, and cutting 2 for Soil B, which flowers pink. A cutting from the blue plant also flowers pink in Soil B.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="631" height="279" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Cuttings and soil trials</text><rect x="21.0" y="87.0" width="148.0" height="62.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="95.0" y="113.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Original plant</text><text x="95.0" y="133.0" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">Source of both cuttings</text><rect x="215.0" y="58.0" width="182.0" height="62.0" rx="8" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="306.0" y="84.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">1  Cutting 1</text><text x="306.0" y="104.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="normal">Soil A → blue</text><rect x="215.0" y="159.0" width="182.0" height="62.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="306.0" y="185.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">2  Cutting 2</text><text x="306.0" y="205.0" font-size="14" fill="#d4600f" text-anchor="middle" font-weight="normal">Soil B → pink</text><rect x="431.0" y="58.0" width="182.0" height="62.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="522.0" y="84.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">3  From Trial 1</text><text x="522.0" y="104.0" font-size="14" fill="#d4600f" text-anchor="middle" font-weight="normal">Soil B → pink</text><line x1="172.0" y1="105.0" x2="210.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="172.0" y1="132.0" x2="210.0" y2="184.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="400.0" y1="89.0" x2="427.0" y2="89.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="316.0" y="253.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Shared conditions: light, water, temperature, and growing time</text></svg>
