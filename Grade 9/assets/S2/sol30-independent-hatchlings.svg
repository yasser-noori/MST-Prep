<svg xmlns="http://www.w3.org/2000/svg" width="614" height="171" viewBox="0 0 614 171" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The next hatchling follows its own chance rule</title><desc>The first four hatchlings are spotted. The fifth can be spotted or plain, with the same one-in-two chance for each possibility.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="613" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">The next hatchling follows its own chance rule</text><circle cx="49.0" cy="86.0" r="20.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><circle cx="42.0" cy="82.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="54.0" cy="80.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="52.0" cy="93.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><text x="49.0" y="122.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">1</text><circle cx="110.0" cy="86.0" r="20.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><circle cx="103.0" cy="82.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="115.0" cy="80.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="113.0" cy="93.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><text x="110.0" y="122.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">2</text><circle cx="171.0" cy="86.0" r="20.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><circle cx="164.0" cy="82.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="176.0" cy="80.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="174.0" cy="93.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><text x="171.0" y="122.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">3</text><circle cx="232.0" cy="86.0" r="20.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><circle cx="225.0" cy="82.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="237.0" cy="80.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><circle cx="235.0" cy="93.0" r="2.5" fill="#d4600f" stroke="none" stroke-width="1.5"/><text x="232.0" y="122.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text><line x1="276.0" y1="51.0" x2="276.0" y2="137.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="441.0" y="40.0" width="151.0" height="34.0" rx="8" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="516.0" y="62.0" font-size="14" fill="#d4600f" text-anchor="middle" font-weight="bold">Spotted: 1 in 2</text><line x1="375.0" y1="85.0" x2="437.0" y2="57.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="441.0" y="95.0" width="151.0" height="34.0" rx="8" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="516.0" y="117.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">Plain: 1 in 2</text><line x1="375.0" y1="85.0" x2="437.0" y2="112.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="329.0" y="91.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Fifth</text><text x="141.0" y="147.0" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal">Earlier results</text></svg>
