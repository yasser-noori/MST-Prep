<svg xmlns="http://www.w3.org/2000/svg" width="646" height="208" viewBox="0 0 646 208" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>From the whole cell to one gene</title><desc>The cell contains a nucleus. Its nucleus holds chromosomes. A chromosome contains packaged DNA, and a gene is a short stretch of that DNA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="645" height="207" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="28.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">From the whole cell to one gene</text><rect x="20.0" y="48.0" width="126.0" height="135.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="83.0" y="149.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Cell</text><text x="83.0" y="169.0" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">Contains a nucleus</text><rect x="169.0" y="48.0" width="126.0" height="135.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="232.0" y="149.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Nucleus</text><text x="232.0" y="169.0" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">Holds chromosomes</text><rect x="318.0" y="48.0" width="126.0" height="135.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="381.0" y="149.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Chromosome</text><text x="381.0" y="169.0" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">Contains packaged DNA</text><rect x="482.0" y="48.0" width="126.0" height="135.0" rx="8" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="545.0" y="149.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">DNA and gene</text><text x="545.0" y="169.0" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">A gene is a short stretch</text><line x1="150.0" y1="104.0" x2="165.0" y2="104.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="299.0" y1="104.0" x2="314.0" y2="104.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="448.0" y1="104.0" x2="478.0" y2="104.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="83.0" cy="101.0" r="34.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><circle cx="87.0" cy="99.0" r="13.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><circle cx="232.0" cy="101.0" r="31.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><path d="M214,99 q7,16 14,8" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M225,86 q7,20 14,10" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M239,103 q7,-14 14,-7" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/><path d="M350,115 q14,-42 26,-17 t34,-12" fill="none" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/><rect x="522.0" y="80.0" width="47.0" height="43.0" rx="4" fill="#ffe6d2" stroke="#d4600f" stroke-width="1.5"/><line x1="496.0" y1="102.0" x2="496.0" y2="102.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="504.2" y1="93.3" x2="504.2" y2="110.7" stroke="#d0d7de" stroke-width="1.5"/><line x1="512.3" y1="93.3" x2="512.3" y2="110.7" stroke="#d0d7de" stroke-width="1.5"/><line x1="520.5" y1="102.0" x2="520.5" y2="102.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="528.7" y1="110.7" x2="528.7" y2="93.3" stroke="#d0d7de" stroke-width="1.5"/><line x1="536.8" y1="110.7" x2="536.8" y2="93.3" stroke="#d0d7de" stroke-width="1.5"/><line x1="545.0" y1="102.0" x2="545.0" y2="102.0" stroke="#d0d7de" stroke-width="1.5"/><line x1="553.2" y1="93.3" x2="553.2" y2="110.7" stroke="#d0d7de" stroke-width="1.5"/><line x1="561.3" 