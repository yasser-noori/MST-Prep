<svg xmlns="http://www.w3.org/2000/svg" width="600" height="213" viewBox="0 0 600 213" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>From a cell to a gene</title><desc>A typical cell contains a nucleus. The nucleus holds chromosomes. The enlarged chromosome contains DNA, and a gene is a stretch of that DNA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="212" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="94.0" y="37.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Cell</text><text x="274.0" y="37.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Nucleus</text><text x="465.0" y="37.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Chromosome</text><circle cx="94.0" cy="114.0" r="55.0" fill="#ddeaff" stroke="#1f6feb" stroke-width="3"/><circle cx="106.0" cy="113.0" r="24.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><circle cx="274.0" cy="113.0" r="55.0" fill="#ffe6d2" stroke="#d4600f" stroke-width="3"/><path d="M245 113 q7 -13 20 -6 M263 82 q9 10 20 2 M278 109 q13 9 21 -2 M262 130 q7 13 17 9" fill="none" stroke="#d4600f" stroke-width="4" stroke-linejoin="round"/><path d="M286 138 q12 6 18 -7" fill="none" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/><line x1="155.0" y1="113.0" x2="206.0" y2="113.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="331.0" y1="113.0" x2="365.0" y2="113.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="375.0" y="72.0" width="179.0" height="79.0" rx="14" fill="#fff" stroke="#1f2328" stroke-width="2"/><rect x="441.0" y="89.0" width="45.0" height="44.0" rx="6" fill="#dcf5e3" stroke="#1a7f37" stroke-width="1.5"/><path d="M391 104 q12 -15 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#1f6feb" stroke-width="3" stroke-linejoin="round"/><path d="M391 118 q12 15 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#1f6feb" stroke-width="3" stroke-linejoin="round"/><line x1="464.0" y1="136.0" x2="464.0" y2="171.0" stroke="#1a7f37" stroke-width="1.5"/><text x="464.0" y="190.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">Gene</text><line x1="525.0" y1="121.0" x2="549.0" y2="170.0" stroke="#57606a" stroke-width="1.4"/><text x="551.0" y="190.0" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="bold">DNA</text></svg>
