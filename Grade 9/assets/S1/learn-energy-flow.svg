<svg xmlns="http://www.w3.org/2000/svg" width="600" height="154" viewBox="0 0 600 154" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Follow energy from the producer</title><desc>Grass makes its own food. A rabbit eats the grass, and a fox eats the rabbit. Energy flows from grass to rabbit to fox.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="153" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Follow energy from the producer</text><line x1="158.0" y1="82.0" x2="234.0" y2="82.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="366.0" y1="82.0" x2="442.0" y2="82.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="39.0" y="65.0" width="112.0" height="34.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="95.0" y="87.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Grass</text><text x="95.0" y="122.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Producer</text><rect x="244.0" y="65.0" width="112.0" height="34.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="300.0" y="87.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Rabbit</text><text x="300.0" y="122.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Consumer</text><rect x="449.0" y="65.0" width="112.0" height="34.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="505.0" y="87.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Fox</text><text x="505.0" y="122.0" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal">Consumer</text></svg>
