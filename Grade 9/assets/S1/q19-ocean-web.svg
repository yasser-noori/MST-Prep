<svg xmlns="http://www.w3.org/2000/svg" width="662" height="206" viewBox="0 0 662 206" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Ocean food web</title><desc>Phytoplankton are eaten by zooplankton, which are eaten by sardines. Sardines are eaten by tuna and seabirds. Sharks eat tuna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="661" height="205" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Ocean food web</text><line x1="138.0" y1="117.0" x2="154.0" y2="117.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="270.0" y1="117.0" x2="286.0" y2="117.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="376.0" y1="109.0" x2="395.0" y2="109.0" stroke="#57606a" stroke-width="1.6"/><line x1="395.0" y1="109.0" x2="395.0" y2="74.0" stroke="#57606a" stroke-width="1.6"/><line x1="395.0" y1="74.0" x2="413.0" y2="74.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="376.0" y1="126.0" x2="395.0" y2="126.0" stroke="#57606a" stroke-width="1.6"/><line x1="395.0" y1="126.0" x2="395.0" y2="158.0" stroke="#57606a" stroke-width="1.6"/><line x1="395.0" y1="158.0" x2="413.0" y2="158.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="513.0" y1="74.0" x2="553.0" y2="74.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25.0" y="100.0" width="110.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="80.0" y="122.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Phytoplankton</text><rect x="157.0" y="100.0" width="110.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="212.0" y="122.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Zooplankton</text><rect x="286.0" y="100.0" width="88.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="330.0" y="122.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Sardine</text><rect x="416.0" y="57.0" width="94.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="463.0" y="79.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Tuna</text><rect x="416.0" y="141.0" width="94.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="463.0" y="163.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Seabird</text><rect x="556.0" y="57.0" width="90.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="601.0" y="79.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Shark</text><text x="22.0" y="192.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Feeding arrows point from food to eater.</text></svg>
