<svg xmlns="http://www.w3.org/2000/svg" width="555" height="106" viewBox="0 0 555 106" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Kelp forest food chain</title><desc>Kelp is eaten by sea urchins, which are eaten by sea otters. Arrows go from food to eater.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="554" height="105" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Kelp forest food chain</text><rect x="18.0" y="48.0" width="151.0" height="38.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="93.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Kelp</text><line x1="171.0" y1="67.0" x2="188.0" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="191.0" y="48.0" width="151.0" height="38.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="266.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Sea urchin</text><line x1="344.0" y1="67.0" x2="361.0" y2="67.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="364.0" y="48.0" width="151.0" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="439.5" y="72.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Sea otter</text></svg>
