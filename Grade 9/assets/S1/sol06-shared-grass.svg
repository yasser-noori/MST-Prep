<svg xmlns="http://www.w3.org/2000/svg" width="590" height="152" viewBox="0 0 590 152" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Follow the indirect effect</title><desc>Fewer foxes can lead to more rabbits, less grass and less food for grasshoppers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="589" height="151" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">Follow the indirect effect</text><rect x="18.0" y="47.0" width="116.5" height="38.0" rx="7" fill="#ddeaff" stroke="#d0d7de" stroke-width="1.5"/><text x="76.2" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Fewer foxes</text><line x1="136.5" y1="66.0" x2="153.5" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="156.5" y="47.0" width="116.5" height="38.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="214.8" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">More rabbits</text><line x1="275.0" y1="66.0" x2="292.0" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="295.0" y="47.0" width="116.5" height="38.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="353.2" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Less grass</text><line x1="413.5" y1="66.0" x2="430.5" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="433.5" y="47.0" width="116.5" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="491.8" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Less food</text><text x="24.0" y="115.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Rabbits and grasshoppers use the same grass.</text><text x="24.0" y="136.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">Grasshoppers may lose food even though foxes do not eat them.</text></svg>
