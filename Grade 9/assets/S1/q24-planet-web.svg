<svg xmlns="http://www.w3.org/2000/svg" width="600" height="198" viewBox="0 0 600 198" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Feeding relationships on the planet</title><desc>Glims eat floots, zarks eat glims, and vexes eat zarks and glims.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="599" height="197" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="29.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">Feeding relationships on the planet</text><line x1="131.0" y1="91.0" x2="170.0" y2="91.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="278.0" y1="91.0" x2="317.0" y2="91.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="425.0" y1="91.0" x2="464.0" y2="91.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="223.0" y1="111.0" x2="223.0" y2="138.0" stroke="#57606a" stroke-width="1.6"/><line x1="223.0" y1="138.0" x2="517.0" y2="138.0" stroke="#57606a" stroke-width="1.6"/><line x1="517.0" y1="138.0" x2="517.0" y2="111.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="23.0" y="74.0" width="106.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="76.0" y="96.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Floots</text><rect x="170.0" y="74.0" width="106.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="223.0" y="96.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Glims</text><rect x="317.0" y="74.0" width="106.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="370.0" y="96.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Zarks</text><rect x="464.0" y="74.0" width="106.0" height="34.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="517.0" y="96.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Vexes</text><text x="22.0" y="184.0" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Feeding arrows point from food to eater.</text></svg>
