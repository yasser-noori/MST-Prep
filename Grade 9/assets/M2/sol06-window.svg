<svg xmlns="http://www.w3.org/2000/svg" width="520" height="258" viewBox="0 0 520 258" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Follow the outside boundary</title><desc>A semicircle sits on top of an 8 cm wide and 10 cm tall rectangle. The outside boundary is the curved arc and three straight sides.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="257" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Follow the outside boundary</text><path d="M104,105 a48,48 0 0 1 96,0 V225 H104 Z" fill="#ddeaff" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><path d="M104,105 a48,48 0 0 1 96,0" fill="none" stroke="#d4600f" stroke-width="4" stroke-linejoin="round"/><path d="M104,105 V225 H200 V105" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linejoin="round"/><line x1="104.0" y1="105.0" x2="200.0" y2="105.0" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="86.0" y1="105.0" x2="86.0" y2="225.0" stroke="#57606a" stroke-width="1.5"/><line x1="82.0" y1="105.0" x2="90.0" y2="105.0" stroke="#57606a" stroke-width="1.5"/><line x1="82.0" y1="225.0" x2="90.0" y2="225.0" stroke="#57606a" stroke-width="1.5"/><text x="52.0" y="168.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">10 cm</text><line x1="104.0" y1="232.0" x2="200.0" y2="232.0" stroke="#57606a" stroke-width="1.5"/><line x1="104.0" y1="236.0" x2="104.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><line x1="200.0" y1="236.0" x2="200.0" y2="228.0" stroke="#57606a" stroke-width="1.5"/><text x="152.0" y="251.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">8 cm</text><text x="232.0" y="88.0" font-size="15" fill="#93400d" text-anchor="start" font-weight="bold">Curved arc  ·  3.14 × 8 ÷ 2 = 12.56 cm</text><text x="232.0" y="122.0" font-size="15" fill="#174ea6" text-anchor="start" font-weight="bold">Straight sides  ·  10 + 8 + 10 = 28 cm</text><text x="232.0" y="154.0" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">The dashed join is inside the frame.</text><rect x="229.0" y="174.0" width="259.0" height="37.0" rx="6" fill="#dcf5e3" stroke="none" stroke-width="1.5"/><text x="358.0" y="198.0" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="bold">Frame length = 40.56 cm</text></svg>
