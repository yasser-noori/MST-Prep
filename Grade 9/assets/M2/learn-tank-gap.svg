<svg xmlns="http://www.w3.org/2000/svg" width="520" height="239" viewBox="0 0 520 239" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Fill the gap above the water</title><desc>The 12 cm full height minus the 5 cm water depth leaves 7 cm. An 80 square centimetre base times this gap gives 560 millilitres of room.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="238" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Fill the gap above the water</text><rect x="29.0" y="56.0" width="130.0" height="84.0" rx="0" fill="#ffe6d2" stroke="none" stroke-width="1.5"/><rect x="29.0" y="140.0" width="130.0" height="60.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M29,56 V200 H159 V56" fill="none" stroke="#1f2328" stroke-width="2" stroke-linejoin="round"/><line x1="29.0" y1="140.0" x2="159.0" y2="140.0" stroke="#1f6feb" stroke-width="2"/><text x="94.0" y="105.0" font-size="16" fill="#93400d" text-anchor="middle" font-weight="bold">Room to fill</text><text x="94.0" y="174.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Water</text><line x1="174.0" y1="56.0" x2="174.0" y2="140.0" stroke="#57606a" stroke-width="1.5"/><line x1="170.0" y1="56.0" x2="178.0" y2="56.0" stroke="#57606a" stroke-width="1.5"/><line x1="170.0" y1="140.0" x2="178.0" y2="140.0" stroke="#57606a" stroke-width="1.5"/><text x="185.0" y="105.0" font-size="16" fill="#93400d" text-anchor="start" font-weight="bold">7 cm</text><line x1="174.0" y1="140.0" x2="174.0" y2="200.0" stroke="#57606a" stroke-width="1.5"/><line x1="170.0" y1="140.0" x2="178.0" y2="140.0" stroke="#57606a" stroke-width="1.5"/><line x1="170.0" y1="200.0" x2="178.0" y2="200.0" stroke="#57606a" stroke-width="1.5"/><text x="185.0" y="174.0" font-size="16" fill="#174ea6" text-anchor="start" font-weight="bold">5 cm</text><line x1="228.0" y1="58.0" x2="228.0" y2="203.0" stroke="#d0d7de" stroke-width="1.5"/><text x="249.0" y="81.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Gap = 12 − 5 = 7 cm</text><text x="249.0" y="112.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Base = 10 × 8 = 80 cm²</text><text x="249.0" y="143.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="normal">Room = 80 × 7 = 560 cm³</text><rect x="246.0" y="157.0" width="244.0" height="42.0" rx="6" fill="#ffe6d2" stroke="none" stroke-width="1.5"/><text x="368.0" y="184.0" font-size="17" fill="#93400d" text-anchor="middle" font-weight="bold">560 mL more can fit</text></svg>
