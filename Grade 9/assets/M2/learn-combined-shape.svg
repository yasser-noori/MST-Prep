<svg xmlns="http://www.w3.org/2000/svg" width="520" height="184" viewBox="0 0 520 184" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A rectangle with a round end</title><desc>A rectangle measures 8 centimetres by 6 centimetres. A semicircle with radius 3 centimetres shares the right-hand side. The shared side is dashed, and the solid outline follows the perimeter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="519" height="183" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">A rectangle with a round end</text><rect x="76.0" y="61.0" width="112.0" height="84.0" rx="0" fill="#ddeaff" stroke="none" stroke-width="1.5"/><path d="M188,61 A42,42 0 0 1 188,145 Z" fill="#ffe6d2" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M188,61 H76 V145 H188 A42,42 0 0 0 188,61" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/><line x1="188.0" y1="61.0" x2="188.0" y2="145.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="132.0" y="166.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">8 cm</text><text x="49.0" y="108.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal">6 cm</text><path d="M188,103 H246" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/><text x="260.0" y="97.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Shared side = diameter = 6 cm</text><text x="260.0" y="121.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="normal">Radius = 3 cm</text></svg>
