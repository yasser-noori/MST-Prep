<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>GCF or LCM?</title><desc>Decision chart: cutting up amounts you already have uses the GCF; building up to a total or time that several step sizes all reach uses the LCM.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="679" height="249" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="190.0" y="18.0" width="300.0" height="44.0" rx="10" fill="#f2f4f7" stroke="#57606a" stroke-width="1.5"/><text x="340.0" y="46.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Am I cutting up or building up?</text><line x1="290.0" y1="62.0" x2="175.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="390.0" y1="62.0" x2="505.0" y2="92.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20.0" y="96.0" width="310.0" height="140.0" rx="10" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/><text x="175.0" y="120.0" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="bold">Cutting up amounts I already have</text><text x="175.0" y="156.0" font-size="28" fill="#1f6feb" text-anchor="middle" font-weight="bold">GCF</text><text x="175.0" y="182.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">The answer is no bigger than</text><text x="175.0" y="200.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">the amounts you start with.</text><text x="175.0" y="218.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">18 red + 30 blue → 6 bags</text><rect x="350.0" y="96.0" width="310.0" height="140.0" rx="10" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><text x="505.0" y="120.0" font-size="14" fill="#d4600f" text-anchor="middle" font-weight="bold">Building up to a shared total or time</text><text x="505.0" y="156.0" font-size="28" fill="#d4600f" text-anchor="middle" font-weight="bold">LCM</text><text x="505.0" y="182.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">The answer is at least as big</text><text x="505.0" y="200.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">as the largest step.</text><text x="505.0" y="218.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">packs of 18 and 30 → 90 each</text></svg>
