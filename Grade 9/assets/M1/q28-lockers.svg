<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lockers and students</title><desc>A row of lockers 1 to 12 (of 100). Student 3 changes lockers 3, 6, 9 and 12, shown highlighted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="679" height="209" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="30.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">M1-Q28: what one student does (student 3)</text><rect x="20.0" y="56.0" width="44.0" height="80.0" rx="4" fill="#f2f4f7" stroke="#57606a" stroke-width="1.5"/><line x1="54.0" y1="92.0" x2="54.0" y2="104.0" stroke="#57606a" stroke-width="2"/><text x="42.0" y="78.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text><rect x="70.0" y="56.0" width="44.0" height="80.0" rx="4" fill="#f2f4f7" stroke="#57606a" stroke-width="1.5"/><line x1="104.0" y1="92.0" x2="104.0" y2="104.0" stroke="#57606a" stroke-width="2"/><text x="92.0" y="78.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">2</text><rect x="120.0" y="56.0" width="44.0" height="80.0" rx="4" fill="#ffe6d2" stroke="#d4600f" stroke-width="2"/><line x1="154.0" y1="92.0" x2="154.0" y2="104.0" stroke="#57606a" stroke-width="2"/><text x="142.0" y="78.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">3</text><text x="142.0" y="156.0" font-size="11" fill="#d4600f" text-anchor="middle" font-weight="bold">change</text><rect x="170.0" y="56.0" width="44.0" height="80.0" rx="4" fill="#f2f4f7" stroke="#57606a" stroke-width="1.5"/><line x1="204.0" y1="92.0" x2="204.0" y2="104.0" stroke="#57606a" stroke-width="2"/><text x="192.0" y="78.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weig