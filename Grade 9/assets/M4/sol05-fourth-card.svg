<svg xmlns="http://www.w3.org/2000/svg" width="568" height="158" viewBox="0 0 568 158" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The fourth card separates the rules</title><desc>Both begin 4, 9, 17. Rule P then adds 11 to get 28, while Q adds 5 to get 22.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="567" height="157" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="27.0" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">The fourth card separates the rules</text><rect x="18.0" y="47.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="73.5" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><line x1="131.0" y1="66.0" x2="148.0" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="151.0" y="47.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="206.5" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">9  (+5)</text><line x1="264.0" y1="66.0" x2="281.0" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="284.0" y="47.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="339.5" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">17  (+8)</text><line x1="397.0" y1="66.0" x2="414.0" y2="66.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="417.0" y="47.0" width="111.0" height="38.0" rx="7" fill="#dcf5e3" stroke="#d0d7de" stroke-width="1.5"/><text x="472.5" y="71.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">P: 28  (+11)</text><rect x="18.0" y="102.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="73.5" y="126.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><line x1="131.0" y1="121.0" x2="148.0" y2="121.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="151.0" y="102.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="206.5" y="126.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">9  (+5)</text><line x1="264.0" y1="121.0" x2="281.0" y2="121.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="284.0" y="102.0" width="111.0" height="38.0" rx="7" fill="#f2f4f7" stroke="#d0d7de" stroke-width="1.5"/><text x="339.5" y="126.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">17  (+8)</text><line x1="397.0" y1="121.0" x2="414.0" y2="121.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="417.0" y="102.0" width="111.0" height="38.0" rx="7" fill="#ffe6d2" stroke="#d0d7de" stroke-width="1.5"/><text x="472.5" y="126.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Q: 22  (+5)</text></svg>
