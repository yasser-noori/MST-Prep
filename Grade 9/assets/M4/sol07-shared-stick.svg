<svg xmlns="http://www.w3.org/2000/svg" width="540" height="183" viewBox="0 0 540 183" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Use the shared stick once</title><desc>A first square uses four sticks. Each added square keeps the existing shared side and adds three sticks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="182" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Use the shared stick once</text><rect x="63.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="3"/><text x="84.0" y="137.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">4</text><rect x="205.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="3"/><path d="M247,70 h42 v42 h-42" fill="none" stroke="#d4600f" stroke-width="3" stroke-linejoin="round"/><text x="247.0" y="137.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">4 + 3</text><rect x="365.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#ddeaff" stroke="#1f6feb" stroke-width="3"/><path d="M407,70 h42 v42 h-42" fill="none" stroke="#d4600f" stroke-width="3" stroke-linejoin="round"/><path d="M449,70 h42 v42 h-42" fill="none" stroke="#d4600f" stroke-width="3" stroke-linejoin="round"/><text x="428.0" y="137.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">4 + 3 + 3</text><text x="270.0" y="165.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">Eight squares use 4 + 7 × 3 = 25 sticks.</text></svg>
