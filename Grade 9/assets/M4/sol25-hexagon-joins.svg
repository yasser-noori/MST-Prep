<svg xmlns="http://www.w3.org/2000/svg" width="540" height="196" viewBox="0 0 540 196" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Count each join once</title><desc>Three hexagons have two shared sides. The separate count 18 counts two extra sides; the distinct count is 16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="539" height="195" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22.0" y="31.0" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Count each join once</text><path d="M218.03847577293368,65 L244.01923788646684,80.0 V110.0 L218.03847577293368,125 L192.05771365940052,110.0 V80.0 Z" fill="#ddeaff" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/><path d="M270.0,65 L295.98076211353316,80.0 V110.0 L270.0,125 L244.01923788646684,110.0 V80.0 Z" fill="#ddeaff" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/><path d="M321.9615242270663,65 L347.9422863405995,80.0 V110.0 L321.9615242270663,125 L295.98076211353316,110.0 V80.0 Z" fill="#ddeaff" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/><line x1="244.0" y1="80.0" x2="244.0" y2="110.0" stroke="#d4600f" stroke-width="4"/><line x1="244.0" y1="113.0" x2="244.0" y2="132.0" stroke="#d4600f" stroke-width="1.5"/><line x1="296.0" y1="80.0" x2="296.0" y2="110.0" stroke="#d4600f" stroke-width="4"/><line x1="296.0" y1="113.0" x2="296.0" y2="132.0" stroke="#d4600f" stroke-width="1.5"/><text x="270.0" y="151.0" font-size="15" fill="#93400d" text-anchor="middle" font-weight="bold">2 shared sides</text><text x="270.0" y="178.0" font-size="16" fill="#174ea6" text-anchor="middle" font-weight="bold">3 × 6 − 2 = 16 distinct sides</text></svg>
